        async function persistDemand(updatedTask) {
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            await postUpdateDemandToGas(updatedTask);
            state.syncFeedback = `Salvo na planilha às ${formatCurrentTime()}`;
            return true;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao salvar demanda na planilha.";
            return false;
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistDeleteDemand(taskId) {
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            await postDeleteDemandToGas(taskId);
            state.syncFeedback = `Demanda excluída às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao excluir demanda na planilha.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistNewDemand(newTask) {
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            const responsePayload = await postCreateDemandToGas(newTask);
            if (responsePayload && responsePayload.demandas) {
              const excluded = new Set(loadStoredIdList(STORAGE_DELETED_IDS_KEY));
              const nextTasks = responsePayload.demandas.filter(
                (d) => !excluded.has(d.id)
              );
              const nextRules = responsePayload.regras || state.rules;
              state.tasks = nextTasks;
              if (responsePayload.regras) {
                state.rules = nextRules;
              }
              state.categories = mergeCategoryLists(
                state.categories,
                responsePayload.categorias || [],
                nextRules,
                nextTasks,
                state.deletedCategories
              );
              saveStoredCategories(state.categories);
              state.labels = mergeLabelLists(
                state.labels.length > 0 ? state.labels : ["Geral"],
                nextRules,
                nextTasks
              );
              saveStoredLabels(state.labels);
            }
            state.syncFeedback = `Demanda criada na planilha às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao criar demanda na planilha.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistRules(nextRules) {
          state.isSaving = true;
          state.apiError = null;
          state.rulesSavedFeedback = null;
          render();
          try {
            await postSaveRulesToGas(nextRules);
            const timeLabel = formatCurrentTime();
            state.syncFeedback = `Regras salvas na planilha às ${timeLabel}`;
            state.rulesSavedFeedback = `Regras salvas na planilha às ${timeLabel}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao salvar regras na planilha.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistRenamedOrDeletedLabel(nextRules, updatedTasks) {
          if (!nextRules && updatedTasks.length === 0) {
            render();
            return;
          }
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            const promises = [];
            if (nextRules) {
              promises.push(postSaveRulesToGas(nextRules));
            }
            for (const task of updatedTasks) {
              promises.push(postUpdateDemandToGas(task));
            }
            await Promise.all(promises);
            state.syncFeedback = `Rótulos sincronizados às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error
                ? err.message
                : "Não foi possível sincronizar o rótulo atualizado na Planilha Google.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        function commitLabelItemEdit(oldLabel) {
          const cleaned = state.labelItemDraft.trim();
          state.editingLabelItem = null;
          state.labelItemDraft = "";
          if (!cleaned || oldLabel === "Geral" || cleaned === oldLabel) {
            render();
            return;
          }

          const replaced = state.labels.map((lbl) => (lbl === oldLabel ? cleaned : lbl));
          state.labels = mergeLabelLists(replaced, [], []);
          saveStoredLabels(state.labels);

          const nextColors = { ...state.labelColors };
          const oldColor = findLabelColorHex(oldLabel, nextColors);
          for (const k of Object.keys(nextColors)) {
            if (k.toLowerCase() === oldLabel.toLowerCase()) delete nextColors[k];
          }
          if (oldColor) {
            nextColors[cleaned] = oldColor;
          }
          state.labelColors = nextColors;
          saveStoredLabelColors(nextColors);
          if (state.colorPickerLabel === oldLabel) {
            state.colorPickerLabel = cleaned;
          }

          let rulesChanged = false;
          const nextRules = state.rules.map((r) => {
            if (normalizeRuleAction(r.acao) === "Ignorar") return r;
            const items = parseMultiValueField(r.rotulo, "Geral");
            if (items.includes(oldLabel)) {
              rulesChanged = true;
              const updatedList = normalizeTagList(
                items.map((i) => (i === oldLabel ? cleaned : i)),
                "Geral"
              );
              return { ...r, rotulo: updatedList.join(", ") };
            }
            return r;
          });
          if (rulesChanged) {
            state.rules = nextRules;
          }

          const updatedTasks = [];
          const nextTasks = state.tasks.map((t) => {
            const items = getTaskLabels(t);
            if (items.includes(oldLabel)) {
              const updatedList = normalizeTagList(
                items.map((i) => (i === oldLabel ? cleaned : i)),
                "Geral"
              );
              const updated = {
                ...t,
                rotulos: updatedList,
                rotulo_aplicado: updatedList.join(", "),
              };
              updatedTasks.push(updated);
              return updated;
            }
            return t;
          });
          if (updatedTasks.length > 0) {
            state.tasks = nextTasks;
          }

          if (state.labelFilter === oldLabel) {
            state.labelFilter = cleaned;
          }

          void persistRenamedOrDeletedLabel(
            rulesChanged ? nextRules : null,
            updatedTasks
          );
        }

        function deleteLabelItem(labelToDelete) {
          if (labelToDelete === "Geral") return;
          state.labels = state.labels.filter((lbl) => lbl !== labelToDelete);
          saveStoredLabels(state.labels);

          const nextColors = { ...state.labelColors };
          for (const k of Object.keys(nextColors)) {
            if (k.toLowerCase() === labelToDelete.toLowerCase()) delete nextColors[k];
          }
          state.labelColors = nextColors;
          saveStoredLabelColors(nextColors);
          if (state.colorPickerLabel === labelToDelete) {
            state.colorPickerLabel = null;
          }

          let rulesChanged = false;
          const nextRules = state.rules.map((r) => {
            if (normalizeRuleAction(r.acao) === "Ignorar") return r;
            const items = parseMultiValueField(r.rotulo, "Geral");
            if (items.includes(labelToDelete)) {
              rulesChanged = true;
              const remaining = items.filter((i) => i !== labelToDelete);
              const updatedList = remaining.length > 0 ? remaining : ["Geral"];
              return { ...r, rotulo: updatedList.join(", ") };
            }
            return r;
          });
          if (rulesChanged) {
            state.rules = nextRules;
          }

          const updatedTasks = [];
          const nextTasks = state.tasks.map((t) => {
            const items = getTaskLabels(t);
            if (items.includes(labelToDelete)) {
              const remaining = items.filter((i) => i !== labelToDelete);
              const updatedList = remaining.length > 0 ? remaining : ["Geral"];
              const updated = {
                ...t,
                rotulos: updatedList,
                rotulo_aplicado: updatedList.join(", "),
              };
              updatedTasks.push(updated);
              return updated;
            }
            return t;
          });
          if (updatedTasks.length > 0) {
            state.tasks = nextTasks;
          }

          if (state.labelFilter === labelToDelete) {
            state.labelFilter = "Todos";
          }

          void persistRenamedOrDeletedLabel(
            rulesChanged ? nextRules : null,
            updatedTasks
          );
        }

        function setLabelColor(label, hex) {
          const next = { ...state.labelColors };
          for (const k of Object.keys(next)) {
            if (k.toLowerCase() === label.toLowerCase()) delete next[k];
          }
          if (hex && /^#[0-9a-f]{6}$/i.test(hex)) {
            next[label] = hex.toLowerCase();
          }
          state.labelColors = next;
          saveStoredLabelColors(next);
        }

        async function handleSyncEmails() {
          if (state.isSyncing) return;
          state.isSyncing = true;
          state.apiError = null;
          render();
          try {
            const payload = await syncEmailsFromGas();
            applyGasPayload(payload);
            state.syncFeedback = `Gmail sincronizado às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Falha ao sincronizar e-mails do Gmail.";
          } finally {
            state.isSyncing = false;
            render();
          }
        }

        function exportCsv() {
          const filtered = getFilteredTasks();
          const headers = [
            "Status",
            "Observação do Status",
            "Observações e Acompanhamento",
            "Subtarefas",
            "Mensagens na Conversa",
            "Título",
            "Descrição",
            "Urgência",
            "Prazo",
            "Prazo Original",
            "Categorias",
            "Rótulos Aplicados",
            "Regra Acionada",
            "Solicitante",
            "E-mail Solicitante",
            "Assunto Original",
            "Recebido em (Data/Hora)",
          ];
          const escapeCell = (val) => `"${String(val ?? "").replace(/"/g, '""')}"`;
          const rows = filtered.map((t) =>
            [
              t.status ?? (t.completed ? "Concluído" : "A Fazer"),
              t.statusNote ?? "",
              t.observacoes ?? "",
              (t.subtarefas || [])
                .map((s) => `${s.concluida ? "[x]" : "[ ]"} ${s.titulo}`)
                .join("; "),
              (t.historico_mensagens || []).length || 1,
              t.titulo,
              t.descricao,
              t.urgencia,
              t.prazo ?? "",
              t.prazo_texto_original ?? "",
              getTaskCategories(t).join(", "),
              getTaskLabels(t).join(", "),
              t.regra_acionada ? "Sim" : "Não",
              t.solicitante_nome,
              t.solicitante_email,
              t.assunto_original,
              t.data_hora_email_original || t.data_email_original,
            ]
              .map(escapeCell)
              .join(",")
          );
          const csv = "\uFEFF" + [headers.map(escapeCell).join(","), ...rows].join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `fila-demandas-${new Date().toISOString().slice(0, 10)}.csv`;
          link.click();
          URL.revokeObjectURL(url);
        }

        function flashSavedNoteFeedback(taskId, kind) {
          state.savedNoteFeedback[taskId] = kind;
          if (state.savedNoteTimers[taskId]) {
            window.clearTimeout(state.savedNoteTimers[taskId]);
          }
          render();
          state.savedNoteTimers[taskId] = window.setTimeout(() => {
            delete state.savedNoteFeedback[taskId];
            delete state.savedNoteTimers[taskId];
            render();
          }, 2600);
        }

        async function commitWaitingNote(taskId, rawValue, forceSave = false) {
          const task = state.tasks.find((t) => t.id === taskId);
          if (!task) return;
          markTaskAsViewed(taskId);
          const raw = rawValue !== undefined ? String(rawValue) : String(task.statusNote || "");
          const trimmed = raw.trim();
          const baseline = String(task.observacoes ?? "").trim();
          if (!forceSave && trimmed === baseline) {
            return;
          }
          const cleaned = trimmed || undefined;
          const updated = {
            ...task,
            statusNote: cleaned,
            motivo_aguardo: cleaned,
            observacao_status: cleaned,
            observacoes: cleaned,
          };
          state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
          const ok = await persistDemand(updated);
          if (ok) {
            flashSavedNoteFeedback(taskId, "waiting");
          }
        }

        async function commitObs(taskId) {
          const task = state.tasks.find((t) => t.id === taskId);
          state.editingObsTaskId = null;
          if (!task) {
            render();
            return;
          }
          const trimmed = state.obsDraft.trim();
          const cleaned = trimmed || undefined;
          if (
            (task.observacoes ?? undefined) === cleaned &&
            (task.motivo_aguardo ?? undefined) === cleaned &&
            (task.statusNote ?? undefined) === cleaned
          ) {
            render();
            return;
          }
          const updated = {
            ...task,
            observacoes: cleaned,
            motivo_aguardo: cleaned,
            observacao_status: cleaned,
            statusNote: cleaned,
          };
          state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
          const ok = await persistDemand(updated);
          if (ok) {
            flashSavedNoteFeedback(taskId, "obs");
          }
        }

        function togglePickerOption(optionValue) {
          if (state.openModalPickerType && state.modalTask) {
            const isLabel = state.openModalPickerType === "label";
            const fallback = isLabel ? "Geral" : "Outro";
            const current = normalizeTagList(
              isLabel ? state.modalRotulos : state.modalCategorias,
              fallback
            );
            const exists = current.some(
              (item) => item.toLowerCase() === optionValue.toLowerCase()
            );
            let nextList;
            if (exists) {
              const filtered = current.filter(
                (item) => item.toLowerCase() !== optionValue.toLowerCase()
              );
              nextList = filtered.length > 0 ? filtered : [fallback];
            } else {
              nextList = normalizeTagList([...current, optionValue], fallback);
            }
            if (isLabel) {
              state.modalRotulos = nextList;
            } else {
              state.modalCategorias = nextList;
            }
            render();
            return;
          }

          const activePicker =
            state.openCardPicker ||
            (state.openPanelPickerType && state.selectedTaskId
              ? { taskId: state.selectedTaskId, type: state.openPanelPickerType }
              : null);

          if (activePicker) {
            const { taskId, type } = activePicker;
            const task = state.tasks.find((t) => t.id === taskId);
            if (!task) return;
            const isLabel = type === "label";
            const fallback = isLabel ? "Geral" : "Outro";
            const current = isLabel ? getTaskLabels(task) : getTaskCategories(task);
            const exists = current.some(
              (item) => item.toLowerCase() === optionValue.toLowerCase()
            );
            let nextList;
            if (exists) {
              const filtered = current.filter(
                (item) => item.toLowerCase() !== optionValue.toLowerCase()
              );
              nextList = filtered.length > 0 ? filtered : [fallback];
            } else {
              nextList = normalizeTagList([...current, optionValue], fallback);
            }
            const nextJoined = nextList.join(", ");
            if (nextJoined === current.join(", ")) {
              render();
              return;
            }
            const updated = isLabel
              ? { ...task, rotulos: nextList, rotulo_aplicado: nextJoined }
              : { ...task, categorias: nextList, categoria: nextJoined };
            state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
            void persistDemand(updated);
          }
        }

        function addNewOptionFromPicker() {
          const trimmed = state.pickerNewDraft.trim();
          if (!trimmed) {
            state.pendingFocusPickerInput = true;
            render();
            return;
          }

          if (state.openModalPickerType && state.modalTask) {
            const isLabel = state.openModalPickerType === "label";
            const fallback = isLabel ? "Geral" : "Outro";
            if (isLabel) {
              ensureLabelsTracked([trimmed]);
              state.modalRotulos = normalizeTagList([...state.modalRotulos, trimmed], fallback);
            } else {
              ensureCategoriesTracked([trimmed]);
              state.modalCategorias = normalizeTagList(
                [...state.modalCategorias, trimmed],
                fallback
              );
            }
            state.pickerNewDraft = "";
            state.pendingFocusPickerInput = true;
            render();
            return;
          }

          const activePicker =
            state.openCardPicker ||
            (state.openPanelPickerType && state.selectedTaskId
              ? { taskId: state.selectedTaskId, type: state.openPanelPickerType }
              : null);

          if (activePicker) {
            const { taskId, type } = activePicker;
            const task = state.tasks.find((t) => t.id === taskId);
            if (!task) return;
            const isLabel = type === "label";
            const fallback = isLabel ? "Geral" : "Outro";
            if (isLabel) {
              ensureLabelsTracked([trimmed]);
            } else {
              ensureCategoriesTracked([trimmed]);
            }
            const current = isLabel ? getTaskLabels(task) : getTaskCategories(task);
            const nextList = normalizeTagList([...current, trimmed], fallback);
            const nextJoined = nextList.join(", ");
            state.pickerNewDraft = "";
            state.pendingFocusPickerInput = true;

            if (nextJoined === current.join(", ")) {
              render();
              return;
            }
            const updated = isLabel
              ? { ...task, rotulos: nextList, rotulo_aplicado: nextJoined }
              : { ...task, categorias: nextList, categoria: nextJoined };
            state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
            void persistDemand(updated);
          }
        }

        function getTagContextConfig(context) {
          if (context === "rule-rotulo") {
            return {
              getList: () => state.ruleFormRotulos,
              setList: (v) => { state.ruleFormRotulos = v; },
              getDraft: () => state.ruleFormRotuloDraft,
              setDraft: (v) => { state.ruleFormRotuloDraft = v; },
            };
          }
          if (context === "rule-categoria") {
            return {
              getList: () => state.ruleFormCategorias,
              setList: (v) => { state.ruleFormCategorias = v; },
              getDraft: () => state.ruleFormCategoriaDraft,
              setDraft: (v) => { state.ruleFormCategoriaDraft = v; },
            };
          }
          if (context === "edit-rule-rotulo" && state.editRuleDraft) {
            return {
              getList: () => state.editRuleDraft.rotulos || [],
              setList: (v) => { if (state.editRuleDraft) state.editRuleDraft.rotulos = v; },
              getDraft: () => state.editRuleRotuloDraft,
              setDraft: (v) => { state.editRuleRotuloDraft = v; },
            };
          }
          if (context === "edit-rule-categoria" && state.editRuleDraft) {
            return {
              getList: () => state.editRuleDraft.categorias || [],
              setList: (v) => { if (state.editRuleDraft) state.editRuleDraft.categorias = v; },
              getDraft: () => state.editRuleCategoriaDraft,
              setDraft: (v) => { state.editRuleCategoriaDraft = v; },
            };
          }
          return null;
        }

        function addTagToContext(context, rawText, refocus) {
          const cfg = getTagContextConfig(context);
          if (!cfg) return false;
          const parts = String(rawText ?? "")
            .split(",")
            .map((p) => p.trim())
            .filter(Boolean);
          if (parts.length === 0) return false;
          const next = normalizeTagList([...cfg.getList(), ...parts]);
          cfg.setList(next);
          cfg.setDraft("");
          if (refocus) state.pendingFocusTagContext = context;
          return true;
        }

        function removeTagFromContext(context, value) {
          const cfg = getTagContextConfig(context);
          if (!cfg) return;
          cfg.setList(cfg.getList().filter((item) => item !== value));
        }

        const rootEl = document.getElementById("app");

        rootEl.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const action = btn.dataset.action;

          if (action === "nav") {
            state.view = btn.dataset.view;
            state.mobileMenuOpen = false;
            render();
          } else if (action === "open-mobile-menu") {
            state.mobileMenuOpen = true;
            render();
          } else if (action === "close-mobile-menu") {
            state.mobileMenuOpen = false;
            render();
          } else if (action === "toggle-theme") {
            state.theme = state.theme === "dark" ? "light" : "dark";
            applyTheme(state.theme);
            render();
          } else if (action === "sync-emails") {

          } else if (target.dataset.role === "edit-rule-acao" && state.editRuleDraft) {
            const nextAction = normalizeRuleAction(target.value);
            const matchTypeEl = document.querySelector('[data-role="edit-rule-matchType"]');
            const matchValueEl = document.querySelector('[data-role="edit-rule-matchValue"]');
            if (matchTypeEl) state.editRuleDraft.matchType = matchTypeEl.value;
            if (matchValueEl) state.editRuleDraft.matchValue = matchValueEl.value;
            state.editRuleDraft.acao = nextAction;
            if (nextAction === "Classificar") {
              if (!state.editRuleDraft.rotulos || state.editRuleDraft.rotulos.length === 0) {
                state.editRuleDraft.rotulos = ["Geral"];
              }
              if (
                !state.editRuleDraft.categorias ||
                state.editRuleDraft.categorias.length === 0
              ) {
                state.editRuleDraft.categorias = [state.categories[0] || "Outro"];
              }
            }
            render();
          }
        });

        rootEl.addEventListener("input", (e) => {
          const target = e.target;
          if (target.dataset.role === "panel-field") {
            const field = target.dataset.field;
            const taskId = target.dataset.id;
            if (state.panelDraft && state.panelDraft.taskId === taskId && field) {
              state.panelDraft[field] = target.value;
              const task = state.tasks.find((t) => t.id === taskId);
              const saveBtn = document.querySelector('[data-role="panel-save-btn"]');
              if (saveBtn && task) {
                if (isPanelDraftDirty(task)) {
                  saveBtn.classList.remove("hidden");
                  saveBtn.classList.add("inline-flex");
                } else {
                  saveBtn.classList.add("hidden");
                  saveBtn.classList.remove("inline-flex");
                }
              }
            }
          } else if (target.id === "panel-new-subtask-input") {
            state.newSubtaskDraft = target.value;
          } else if (target.dataset.role === "edit-subtask-input") {
            state.editingSubtaskDraft = target.value;
          } else if (state.modalForm && target.id === "modal-titulo") {
            state.modalForm.titulo = target.value;
          } else if (state.modalForm && target.id === "modal-descricao") {
            state.modalForm.descricao = target.value;
          } else if (state.modalForm && target.id === "modal-solicitante-nome") {
            state.modalForm.solicitante_nome = target.value;
          } else if (state.modalForm && target.id === "modal-solicitante-email") {
            state.modalForm.solicitante_email = target.value;
          } else if (state.modalForm && target.id === "modal-prazo") {
            state.modalForm.prazo = target.value;
          } else if (state.modalForm && target.id === "modal-status-note") {
            state.modalForm.statusNote = target.value;
          } else if (state.modalForm && target.id === "modal-observacoes") {
            state.modalForm.observacoes = target.value;
          } else if (target.id === "task-search-input") {
            const pos = target.selectionStart;
            state.search = target.value;
            render();
            const el = document.getElementById("task-search-input");
            if (el) {
              el.focus();
              if (pos !== null) el.setSelectionRange(pos, pos);
            }
          } else if (target.dataset.role === "waiting-note") {
            const id = target.dataset.id;
            markTaskAsViewed(id);
            state.tasks = state.tasks.map((t) =>
              t.id === id
                ? {
                    ...t,
                    statusNote: target.value,
                    motivo_aguardo: target.value,
                    observacao_status: target.value,
                  }
                : t
            );
          } else if (target.dataset.role === "obs-input") {
            state.obsDraft = target.value;
          } else if (target.dataset.role === "picker-new-input") {
            state.pickerNewDraft = target.value;
          } else if (target.dataset.role === "label-item-input") {
            state.labelItemDraft = target.value;
          } else if (target.dataset.role === "edit-rule-matchValue" && state.editRuleDraft) {
            state.editRuleDraft.matchValue = target.value;
          } else if (target.dataset.role === "tag-input") {
            const ctx = target.dataset.context;
            const cfg = getTagContextConfig(ctx);
            if (cfg) {
              if (target.value.includes(",")) {
                if (addTagToContext(ctx, target.value, true)) {
                  render();
                  return;
                }
              }
              cfg.setDraft(target.value);
            }
          } else if (target.id === "rule-match-value") {
            state.ruleFormMatchValue = target.value;
          } else if (target.id === "new-label-input") {
            state.newLabelInput = target.value;
          } else if (target.id === "new-category-input") {
            state.newCategoryInput = target.value;
          }
        });

        rootEl.addEventListener(
          "blur",
          (e) => {
            const target = e.target;
            if (target.dataset.role === "panel-field") {
              const taskId = target.dataset.id;
              window.setTimeout(() => {
                if (state.selectedTaskId !== taskId || state.confirmDeleteTask) return;
                const currentTask = state.tasks.find((t) => t.id === taskId);
                if (currentTask && isPanelDraftDirty(currentTask)) {
                  commitPanelTextFields(taskId, "Salvo automaticamente");
                }
              }, 120);
            } else if (target.dataset.role === "edit-subtask-input") {
              const taskId = target.dataset.id;
              const subId = target.dataset.subId;
              window.setTimeout(() => {
                if (state.editingSubtaskId === subId) {
                  commitEditSubtask(taskId, subId);
                }
              }, 100);
            } else if (target.dataset.role === "waiting-note") {
              const related = e.relatedTarget;
              if (related && related.dataset && related.dataset.waitingAction === "save") {
                return;
              }
              void commitWaitingNote(target.dataset.id, target.value, false);
            } else if (target.dataset.role === "obs-input") {
              const related = e.relatedTarget;
              if (related && related.dataset && related.dataset.obsAction === "cancel") {
                return;
              }
              void commitObs(target.dataset.id);
            } else if (target.dataset.role === "tag-input") {
              const ctx = target.dataset.context;
              const related = e.relatedTarget;
              if (
                related &&
                related.dataset &&
                (related.dataset.action === "add-tag-item" ||
                  related.dataset.action === "remove-tag-item" ||
                  related.dataset.action === "close-modal" ||
                  related.dataset.action === "cancel-rule-edit")
              ) {
                return;
              }
              const cfg = getTagContextConfig(ctx);
              if (cfg && cfg.getDraft().trim()) {
                if (addTagToContext(ctx, cfg.getDraft(), false)) {
                  render();
                }
              }
            }
          },
          true
        );

        rootEl.addEventListener("keydown", (e) => {
          const target = e.target;
          if (target.id === "panel-new-subtask-input" && e.key === "Enter") {
            e.preventDefault();
            addSubtaskToTask(target.dataset.id);
          } else if (target.dataset.role === "edit-subtask-input") {
            if (e.key === "Enter") {
              e.preventDefault();
              commitEditSubtask(target.dataset.id, target.dataset.subId);
            } else if (e.key === "Escape") {
              e.preventDefault();
              e.stopPropagation();
              state.editingSubtaskId = null;
              state.editingSubtaskDraft = "";
              render();
            }
          } else if (target.dataset.role === "waiting-note" && e.key === "Enter") {
            e.preventDefault();
            void commitWaitingNote(target.dataset.id, target.value, true);
          } else if (target.dataset.role === "obs-input") {
            if (e.key === "Enter") {
              e.preventDefault();
              void commitObs(target.dataset.id);
            } else if (e.key === "Escape") {
              e.preventDefault();
              state.editingObsTaskId = null;
              state.obsDraft = "";
              render();
            }
          } else if (target.dataset.role === "picker-new-input") {
            if (e.key === "Enter") {
              e.preventDefault();
              e.stopPropagation();
              addNewOptionFromPicker();
            } else if (e.key === "Escape") {
              e.preventDefault();
              e.stopPropagation();
              state.openCardPicker = null;
              state.openPanelPickerType = null;
              state.openModalPickerType = null;
              state.pickerNewDraft = "";
              render();
            }
          } else if (target.dataset.role === "label-item-input") {
            if (e.key === "Enter") {
              e.preventDefault();
              commitLabelItemEdit(target.dataset.label);
            } else if (e.key === "Escape") {
              e.preventDefault();
              state.editingLabelItem = null;
              state.labelItemDraft = "";
              render();
            }
          } else if (target.dataset.role === "tag-input") {
            const ctx = target.dataset.context;
            const cfg = getTagContextConfig(ctx);
            if (!cfg) return;
            if (e.key === "Enter" || e.key === ",") {
              if (cfg.getDraft().trim()) {
                e.preventDefault();
                if (addTagToContext(ctx, cfg.getDraft(), true)) {
                  render();
                }
              } else if (e.key === ",") {
                e.preventDefault();
              }
            } else if (e.key === "Backspace" && !cfg.getDraft()) {
              const current = cfg.getList();
              if (current.length > 0) {
                cfg.setList(current.slice(0, -1));
                state.pendingFocusTagContext = ctx;
                render();
              }
            }
          }
        });

        rootEl.addEventListener("submit", (e) => {
          e.preventDefault();
          const form = e.target;
          if (form.id === "modal-task-form" && state.modalTask) {
            const base = state.modalTask;
            const f = state.modalForm || createModalFormDraft(base);
            const titulo = String(document.getElementById("modal-titulo")?.value ?? f.titulo).trim();
            if (!titulo) return;
            const descricao = String(document.getElementById("modal-descricao")?.value ?? f.descricao).trim();
            const solicitanteNomeEl = document.getElementById("modal-solicitante-nome");
            const solicitanteEmailEl = document.getElementById("modal-solicitante-email");
            const solicitanteNomeVal = String(solicitanteNomeEl ? solicitanteNomeEl.value : f.solicitante_nome).trim();
            const solicitanteEmailVal = String(solicitanteEmailEl ? solicitanteEmailEl.value : f.solicitante_email).trim();
            const prazoVal = String(document.getElementById("modal-prazo")?.value ?? f.prazo).trim();
            const urgencia = String(document.getElementById("modal-urgencia")?.value ?? f.urgencia);
            const status = String(document.getElementById("modal-status")?.value ?? f.status);
            const cleanStatusNote = String(document.getElementById("modal-status-note")?.value ?? f.statusNote).trim();
            const cleanObs = String(document.getElementById("modal-observacoes")?.value ?? f.observacoes).trim();
            const prevStatusNote = String(base.statusNote || "").trim();
            const prevObs = String(base.observacoes || "").trim();
            let syncedNote;
            if (cleanStatusNote !== prevStatusNote && cleanObs === prevObs) {
              syncedNote = cleanStatusNote || undefined;
            } else if (cleanObs !== prevObs && cleanStatusNote === prevStatusNote) {
              syncedNote = cleanObs || undefined;
            } else {
              syncedNote = cleanObs || cleanStatusNote || undefined;
            }
            const isCompleted = status === "Concluído";

            const rotulosFinal = normalizeTagList(state.modalRotulos, "Geral");
            const categoriasFinal = normalizeTagList(state.modalCategorias, "Outro");
            const rotuloJoined = rotulosFinal.join(", ");
            const categoriaJoined = categoriasFinal.join(", ");

            ensureCategoriesTracked(categoriasFinal);
            ensureLabelsTracked(rotulosFinal);

            const updated = {
              ...base,
              titulo,
              descricao,
              solicitante_nome: solicitanteNomeVal || "Solicitante",
              solicitante_email: solicitanteEmailVal,
              prazo: prazoVal || null,
              urgencia,
              rotulos: rotulosFinal,
              rotulo_aplicado: rotuloJoined,
              categorias: categoriasFinal,
              categoria: categoriaJoined,
              status,
              statusNote: cleanStatusNote || syncedNote,
              motivo_aguardo: cleanStatusNote || syncedNote,
              observacao_status: syncedNote,
              observacoes: syncedNote,
              completed: isCompleted,
              completedAt: isCompleted ? base.completedAt ?? new Date().toISOString() : undefined,
            };

            const isCreateMode = state.modalMode === "create";
            if (isCreateMode) {
              if (!updated.historico_mensagens || updated.historico_mensagens.length === 0) {
                updated.historico_mensagens = [
                  {
                    id: `msg-${uuid()}`,
                    remetente_nome: "Criação manual",
                    remetente_email: "",
                    data_hora: getNowIsoDateTime(),
                    resumo: descricao || titulo,
                  },
                ];
              }
              state.tasks = [updated, ...state.tasks];
            } else {
              state.tasks = state.tasks.map((t) => (t.id === updated.id ? updated : t));
            }
            state.modalTask = null;
            state.modalForm = null;
            state.openModalPickerType = null;
            state.pickerNewDraft = "";
            state.modalRotulos = [];
            state.modalCategorias = [];
            if (isCreateMode) {
              void persistNewDemand(updated);
            } else {
              void persistDemand(updated);
            }
          } else if (form.id === "create-rule-form") {
            const matchType = document.getElementById("rule-match-type").value;
            const matchValue = document.getElementById("rule-match-value").value.trim();
            const actionEl = document.getElementById("rule-action-select");
            const ruleAction = normalizeRuleAction(
              actionEl ? actionEl.value : state.ruleFormAction
            );
            if (!matchValue) return;

            if (ruleAction === "Ignorar") {
              const newRule = {
                id: uuid(),
                ativo: true,
                matchType,
                matchValue,
                condicao: matchValue,
                acao: "Ignorar",
                rotulo: "",
                categoria: "",
              };
              state.ruleFormMatchValue = "";
              state.ruleFormAction = "Classificar";
              state.ruleFormRotulos = [];
              state.ruleFormCategorias = [state.categories[0] || "Outro"];
              state.ruleFormRotuloDraft = "";
              state.ruleFormCategoriaDraft = "";
              state.rules = [newRule, ...state.rules];
              void persistRules(state.rules);
              return;
            }

            addTagToContext("rule-rotulo", state.ruleFormRotuloDraft, false);
            addTagToContext("rule-categoria", state.ruleFormCategoriaDraft, false);

            const rotulosFinal = normalizeTagList(state.ruleFormRotulos);
            const categoriasFinal = normalizeTagList(state.ruleFormCategorias, "Outro");
            if (rotulosFinal.length === 0) return;

            const newRule = {
              id: uuid(),
              ativo: true,
              matchType,
              matchValue,
              condicao: matchValue,
              acao: "Classificar",
              rotulo: rotulosFinal.join(", "),
              categoria: categoriasFinal.join(", "),
            };
            ensureLabelsTracked(rotulosFinal);
            ensureCategoriesTracked(categoriasFinal);
            state.ruleFormMatchValue = "";
            state.ruleFormAction = "Classificar";
            state.ruleFormRotulos = [];
            state.ruleFormCategorias = [state.categories[0] || "Outro"];
            state.ruleFormRotuloDraft = "";
            state.ruleFormCategoriaDraft = "";
            state.rules = [newRule, ...state.rules];
            void persistRules(state.rules);
          } else if (form.id === "create-label-form") {
            const val = document.getElementById("new-label-input").value.trim();
            if (!val) return;
            ensureLabelsTracked([val]);
            state.newLabelInput = "";
            render();
          } else if (form.id === "create-category-form") {
            const val = document.getElementById("new-category-input").value.trim();
            if (!val) return;
            ensureCategoriesTracked([val]);
            state.newCategoryInput = "";
            render();
          }
        });

        document.addEventListener("mousedown", (e) => {
          let changed = false;
          if (
            (state.openCardPicker || state.openPanelPickerType || state.openModalPickerType) &&
            !e.target.closest("[data-picker-root]")
          ) {
            state.openCardPicker = null;
            state.openPanelPickerType = null;
            state.openModalPickerType = null;
            state.pickerNewDraft = "";
            changed = true;
          }
          if (state.openDeadlinePicker && !e.target.closest("[data-deadline-root]")) {
            state.openDeadlinePicker = null;
            changed = true;
          }
          if (state.isFiltersOpen && !e.target.closest("[data-filters-root]")) {
            state.isFiltersOpen = false;
            changed = true;
          }
          if (changed) render();
        });

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (state.confirmDeleteTask) {
              e.preventDefault();
              state.confirmDeleteTask = null;
              render();
              return;
            }
            if (state.openDeadlinePicker) {
              e.preventDefault();
              state.openDeadlinePicker = null;
              render();
              return;
            }
            if (state.openCardPicker || state.openPanelPickerType || state.openModalPickerType) {
              e.preventDefault();
              state.openCardPicker = null;
              state.openPanelPickerType = null;
              state.openModalPickerType = null;
              state.pickerNewDraft = "";
              render();
              return;
            }
            if (state.isFiltersOpen) {
              e.preventDefault();
              state.isFiltersOpen = false;
              render();
              return;
            }
            if (state.modalTask) {
              state.modalTask = null;
              state.modalForm = null;
              render();
              return;
            }
            if (state.selectedTaskId && !state.editingSubtaskId) {
              state.selectedTaskId = null;
              state.panelDraft = null;
              render();
            }
          }
        });

        async function init() {
          render();
          try {
            const payload = await fetchInitialFromGas();
            applyGasPayload(payload);
            state.syncFeedback = `Dados carregados às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error
                ? err.message
                : "Não foi possível carregar os dados da Planilha Google.";
          } finally {
            state.isInitialLoading = false;
            render();
          }
        }

        init();
      })();
    </script>
  </body>
</html>
