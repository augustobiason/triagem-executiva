              ? `<span class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-500 whitespace-nowrap">
                  <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin text-blue-700"></i>
                  <span>${state.isInitialLoading ? "Carregando planilha..." : "Salvando na planilha..."}</span>
                </span>`
              : state.syncFeedback
              ? `<span class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-500 whitespace-nowrap tabular-nums">
                  <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-600"></i>
                  <span>${escapeHtml(state.syncFeedback)}</span>
                </span>`
              : "";

          const errorBannerHtml = state.apiError
            ? `<div role="alert" class="mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded-xl flex items-start justify-between gap-3 text-xs text-red-800">
                <div class="flex items-start gap-2.5">
                  <i data-lucide="alert-circle" class="w-4 h-4 text-red-700 shrink-0 mt-0.5"></i>
                  <div>
                    <p class="font-semibold text-red-900">Erro de comunicação com o Google Apps Script</p>
                    <p class="mt-0.5 leading-relaxed">${escapeHtml(state.apiError)}</p>
                  </div>
                </div>
                <button type="button" data-action="dismiss-error" aria-label="Fechar aviso de erro"
                  class="p-1 text-red-600 hover:text-red-900 rounded-md cursor-pointer">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>`
            : "";

          const mobileDrawer = state.mobileMenuOpen
            ? `<div class="fixed inset-0 z-40 lg:hidden flex">
                <div data-action="close-mobile-menu" class="fixed inset-0 bg-slate-900/30"></div>
                <aside class="relative z-50 w-64 bg-white h-full border-r border-slate-200">
                  <button type="button" data-action="close-mobile-menu" aria-label="Fechar menu"
                    class="absolute top-4 right-3 p-1.5 text-slate-500 hover:text-slate-900 cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                  </button>
                  ${renderSidebar()}
                </aside>
              </div>`
            : "";

          const root = document.getElementById("app");
          root.innerHTML = `
            <aside class="hidden lg:block w-64 shrink-0 bg-white border-r border-slate-200">
              <div class="sticky top-0 h-screen overflow-y-auto">${renderSidebar()}</div>
            </aside>
            ${mobileDrawer}
            <div class="flex-1 min-w-0 flex flex-col">
              <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3 min-w-0">
                  <button type="button" data-action="open-mobile-menu" aria-label="Abrir menu"
                    class="lg:hidden p-1.5 -ml-1.5 text-slate-600 hover:text-slate-900 cursor-pointer">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                  </button>
                  <span class="text-xs font-medium text-slate-500 truncate whitespace-nowrap">${viewMeta.breadcrumb}</span>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                  ${headerStatusHtml}
                  <button type="button" data-action="sync-emails" ${
                    state.isSyncing || state.isInitialLoading ? "disabled" : ""
                  }
                    class="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-white bg-blue-700 rounded-lg hover:bg-blue-800 disabled:opacity-50 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5 ${
                      state.isSyncing ? "animate-spin" : ""
                    }"></i>
                    <span>${state.isSyncing ? "Sincronizando..." : "Sincronizar E-mails"}</span>
                  </button>
                </div>
              </header>

              <main class="flex-1 p-6 max-w-[1440px] w-full mx-auto">
                ${errorBannerHtml}
                <div class="mb-6">
                  <h1 class="font-display text-2xl font-bold tracking-tight text-slate-900">${viewMeta.title}</h1>
                </div>
                ${state.view === "tasks" ? renderTasksView() : renderRulesView()}
              </main>
            </div>
            ${renderModal()}
          `;

          if (window.lucide && typeof window.lucide.createIcons === "function") {
            window.lucide.createIcons();
          }

          if (state.editingObsTaskId) {
            const obsInput = document.querySelector(`[data-role="obs-input"][data-id="${CSS.escape(state.editingObsTaskId)}"]`);
            if (obsInput) {
              obsInput.focus();
              const len = obsInput.value.length;
              obsInput.setSelectionRange(len, len);
            }
          }

          if (state.editingLabelTaskId) {
            const labelInput = document.querySelector(`[data-role="label-input"][data-id="${CSS.escape(state.editingLabelTaskId)}"]`);
            if (labelInput) {
              labelInput.focus();
              labelInput.select();
            }
          }
        }

        async function persistDemand(updatedTask) {
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            await postUpdateDemandToGas(updatedTask);
            state.syncFeedback = `Salvo na planilha às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao salvar demanda na planilha.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistRules(nextRules) {
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            await postSaveRulesToGas(nextRules);
            state.syncFeedback = `Regras salvas às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao salvar regras na planilha.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function handleSyncEmails() {
          if (state.isSyncing) return;
          state.isSyncing = true;
          state.apiError = null;
          render();
          try {
            const payload = await syncEmailsFromGas();
            applyGasPayload(payload);
            state.syncFeedback = `Gmail sincronizado às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Falha ao sincronizar e-mails do Gmail.";
          } finally {
            state.isSyncing = false;
            render();
          }
        }

        function exportCsv() {
          const filtered = getFilteredTasks();
          const headers = [
            "Status",
            "Observação do Status",
            "Observações e Acompanhamento",
            "Mensagens na Conversa",
            "Título",
            "Descrição",
            "Urgência",
            "Prazo",
            "Prazo Original",
            "Categoria",
            "Rótulo Aplicado",
            "Regra Acionada",
            "Solicitante",
            "E-mail Solicitante",
            "Assunto Original",
            "Recebido em (Data/Hora)",
          ];
          const escapeCell = (val) => `"${String(val ?? "").replace(/"/g, '""')}"`;
          const rows = filtered.map((t) =>
            [
              t.status ?? (t.completed ? "Concluído" : "A Fazer"),
              t.statusNote ?? "",
              t.observacoes ?? "",
              (t.historico_mensagens || []).length || 1,
              t.titulo,
              t.descricao,
              t.urgencia,
              t.prazo ?? "",
              t.prazo_texto_original ?? "",
              t.categoria,
              t.rotulo_aplicado ?? "Geral",
              t.regra_acionada ? "Sim" : "Não",
              t.solicitante_nome,
              t.solicitante_email,
              t.assunto_original,
              t.data_hora_email_original || t.data_email_original,
            ]
              .map(escapeCell)
              .join(",")
          );
          const csv = "\uFEFF" + [headers.map(escapeCell).join(","), ...rows].join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `fila-demandas-${new Date().toISOString().slice(0, 10)}.csv`;
          link.click();
          URL.revokeObjectURL(url);
        }

        function commitObs(taskId) {
          const task = state.tasks.find((t) => t.id === taskId);
          state.editingObsTaskId = null;
          if (!task) {
            render();
            return;
          }
          const cleaned = state.obsDraft.trim() || undefined;
          if ((task.observacoes ?? undefined) === cleaned) {
            render();
            return;
          }
          const updated = { ...task, observacoes: cleaned };
          state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
          void persistDemand(updated);
        }

        function commitLabel(taskId) {
          const task = state.tasks.find((t) => t.id === taskId);
          state.editingLabelTaskId = null;
          if (!task) {
            render();
            return;
          }
          const cleaned = state.labelDraft.trim() || "Geral";
          if ((task.rotulo_aplicado || "Geral") === cleaned) {
            render();
            return;
          }
          const updated = { ...task, rotulo_aplicado: cleaned };
          state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
          void persistDemand(updated);
        }

        const rootEl = document.getElementById("app");

        rootEl.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const action = btn.dataset.action;

          if (action === "nav") {
            state.view = btn.dataset.view;
            state.mobileMenuOpen = false;
            render();
          } else if (action === "open-mobile-menu") {
            state.mobileMenuOpen = true;
            render();
          } else if (action === "close-mobile-menu") {
            state.mobileMenuOpen = false;
            render();
          } else if (action === "sync-emails") {
            void handleSyncEmails();
          } else if (action === "dismiss-error") {
            state.apiError = null;
            render();
          } else if (action === "status-filter") {
            state.statusFilter = btn.dataset.value;
            render();
          } else if (action === "urgency-filter") {
            state.urgencyFilter = btn.dataset.value;
            render();
          } else if (action === "clear-filters") {
            state.search = "";
            state.statusFilter = "Todos";
            state.urgencyFilter = "Todas";
            state.labelFilter = "Todos";
            render();
          } else if (action === "export-csv") {
            exportCsv();
          } else if (action === "mark-seen") {
            const taskId = btn.dataset.id;
            const target = state.tasks.find((t) => t.id === taskId);
            if (target) {
              const updated = { ...target, hasNewMessage: false };
              state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
              void persistDemand(updated);
            }
          } else if (action === "edit-obs") {
            const task = state.tasks.find((t) => t.id === btn.dataset.id);
            if (task) {
              state.editingObsTaskId = task.id;
              state.obsDraft = task.observacoes || "";
              render();
            }
          } else if (action === "save-obs") {
            commitObs(btn.dataset.id);
          } else if (action === "cancel-obs") {
            state.editingObsTaskId = null;
            state.obsDraft = "";
            render();
          } else if (action === "edit-label") {
            const task = state.tasks.find((t) => t.id === btn.dataset.id);
            if (task) {
              state.editingLabelTaskId = task.id;
              state.labelDraft = task.rotulo_aplicado || "Geral";
              render();
            }
          } else if (action === "save-label") {
            commitLabel(btn.dataset.id);
          } else if (action === "cancel-label") {
            state.editingLabelTaskId = null;
            state.labelDraft = "";
            render();
          } else if (action === "toggle-thread") {
            const id = btn.dataset.id;
            state.expandedThreads[id] = !state.expandedThreads[id];
            render();
          } else if (action === "open-edit-modal") {
            const task = state.tasks.find((t) => t.id === btn.dataset.id);
            if (task) {
              state.modalTask = { ...task };
              state.modalMode = "edit";
              state.modalShowHistory = false;
              render();
            }
          } else if (action === "open-create-modal") {
            const nowDt = getNowIsoDateTime();
            state.modalTask = {
              id: `manual-${uuid()}`,
              triageId: "manual",
              titulo: "",
              descricao: "",
              prazo: null,
              prazo_texto_original: null,
              urgencia: "Média",
              categoria: state.categories[0] || "Outro",
              assunto_original: "Demanda manual",
              solicitante_nome: "Criação manual",
              solicitante_email: "",
              data_email_original: nowDt.slice(0, 10),
              data_hora_email_original: nowDt,
              rotulo_aplicado: "Geral",
              regra_acionada: false,
              status: "A Fazer",
              statusNote: "",
              observacoes: "",
              hasNewMessage: false,
              historico_mensagens: [],
              completed: false,
            };
            state.modalMode = "create";
            state.modalShowHistory = false;
            render();
          } else if (action === "close-modal") {
            state.modalTask = null;
            render();
          } else if (action === "modal-backdrop") {
            if (e.target === btn) {
              state.modalTask = null;
              render();
            }
          } else if (action === "clear-modal-prazo") {
            const input = document.getElementById("modal-prazo");
            if (input) input.value = "";
          } else if (action === "toggle-modal-history") {
            state.modalShowHistory = !state.modalShowHistory;
            render();
          } else if (action === "delete-task") {
            const id = btn.dataset.id;
            state.tasks = state.tasks.filter((t) => t.id !== id);
            render();
          } else if (action === "toggle-rule") {
            const id = btn.dataset.id;
            const next = state.rules.map((r) => (r.id === id ? { ...r, ativo: !r.ativo } : r));
            state.rules = next;
            void persistRules(next);
          } else if (action === "edit-rule") {
            const rule = state.rules.find((r) => r.id === btn.dataset.id);
            if (rule) {
              state.editingRuleId = rule.id;
              state.editRuleDraft = { ...rule };
              render();
            }
          } else if (action === "save-rule-edit") {
            const id = btn.dataset.id;
            const matchTypeEl = document.querySelector('[data-role="edit-rule-matchType"]');
            const matchValueEl = document.querySelector('[data-role="edit-rule-matchValue"]');
            const rotuloEl = document.querySelector('[data-role="edit-rule-rotulo"]');
            const categoriaEl = document.querySelector('[data-role="edit-rule-categoria"]');
            const matchValue = matchValueEl ? matchValueEl.value.trim() : "";
            const rotulo = rotuloEl ? rotuloEl.value.trim() : "";
            if (!matchValue || !rotulo) return;
            const next = state.rules.map((r) =>
              r.id === id
                ? {
                    ...r,
                    matchType: matchTypeEl ? matchTypeEl.value : r.matchType,
                    matchValue,
                    rotulo,
                    categoria: categoriaEl ? categoriaEl.value : r.categoria,
                  }
                : r
            );
            state.editingRuleId = null;
            state.editRuleDraft = null;
            state.rules = next;
            void persistRules(next);
          } else if (action === "cancel-rule-edit") {
            state.editingRuleId = null;
            state.editRuleDraft = null;
            render();
          } else if (action === "delete-rule") {
            const id = btn.dataset.id;
            const next = state.rules.filter((r) => r.id !== id);
            state.rules = next;
            void persistRules(next);
          } else if (action === "reset-rules") {
            state.rules = [...DEFAULT_RULES];
            state.categories = [...DEFAULT_CATEGORIES];
            saveStoredCategories(state.categories);
            void persistRules(state.rules);
          } else if (action === "delete-category") {
            const cat = btn.dataset.category;
            if (state.categories.length > 1) {
              state.categories = state.categories.filter((c) => c !== cat);
              saveStoredCategories(state.categories);
              render();
            }
          }
        });

        rootEl.addEventListener("change", (e) => {
          const target = e.target;
          if (target.dataset.role === "task-status-select") {
            const taskId = target.dataset.id;
            const nextStatus = target.value;
            const task = state.tasks.find((t) => t.id === taskId);
            if (!task) return;
            const updated = {
              ...task,
              status: nextStatus,
              completed: nextStatus === "Concluído",
              completedAt:
                nextStatus === "Concluído" ? task.completedAt ?? new Date().toISOString() : undefined,
            };
            state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
            void persistDemand(updated);
          } else if (target.dataset.role === "label-filter") {
            state.labelFilter = target.value;
            render();
          } else if (target.id === "rule-match-type") {
            state.ruleFormMatchType = target.value;
          } else if (target.id === "rule-categoria") {
            state.ruleFormCategoria = target.value;
          }
        });

        rootEl.addEventListener("input", (e) => {
          const target = e.target;
          if (target.id === "task-search-input") {
            const pos = target.selectionStart;
            state.search = target.value;
            render();
            const el = document.getElementById("task-search-input");
            if (el) {
              el.focus();
              if (pos !== null) el.setSelectionRange(pos, pos);
            }
          } else if (target.dataset.role === "waiting-note") {
            const id = target.dataset.id;
            state.tasks = state.tasks.map((t) =>
              t.id === id ? { ...t, statusNote: target.value } : t
            );
          } else if (target.dataset.role === "obs-input") {
            state.obsDraft = target.value;
          } else if (target.dataset.role === "label-input") {
            state.labelDraft = target.value;
          } else if (target.id === "rule-match-value") {
            state.ruleFormMatchValue = target.value;
          } else if (target.id === "rule-rotulo") {
            state.ruleFormRotulo = target.value;
          } else if (target.id === "new-category-input") {
            state.newCategoryInput = target.value;
          }
        });

        rootEl.addEventListener(
          "blur",
          (e) => {
            const target = e.target;
            if (target.dataset.role === "waiting-note") {
              const id = target.dataset.id;
              const task = state.tasks.find((t) => t.id === id);
              if (task) {
                const cleaned = task.statusNote ? task.statusNote.trim() : undefined;
                const updated = { ...task, statusNote: cleaned || undefined };
                state.tasks = state.tasks.map((t) => (t.id === id ? updated : t));
                void persistDemand(updated);
              }
            } else if (target.dataset.role === "obs-input") {
              const related = e.relatedTarget;
              if (related && related.dataset && related.dataset.obsAction === "cancel") {
                return;
              }
              commitObs(target.dataset.id);
            } else if (target.dataset.role === "label-input") {
              const related = e.relatedTarget;
              if (related && related.dataset && related.dataset.labelAction === "cancel") {
                return;
              }
              commitLabel(target.dataset.id);
            }
          },
          true
        );

        rootEl.addEventListener("keydown", (e) => {
          const target = e.target;
          if (target.dataset.role === "waiting-note" && e.key === "Enter") {
            e.preventDefault();
            target.blur();
          } else if (target.dataset.role === "obs-input") {
            if (e.key === "Enter") {
              e.preventDefault();
              commitObs(target.dataset.id);
            } else if (e.key === "Escape") {
              e.preventDefault();
              state.editingObsTaskId = null;
              state.obsDraft = "";
              render();
            }
          } else if (target.dataset.role === "label-input") {
            if (e.key === "Enter") {
              e.preventDefault();
              commitLabel(target.dataset.id);
            } else if (e.key === "Escape") {
              e.preventDefault();
              state.editingLabelTaskId = null;
              state.labelDraft = "";
              render();
            }
          }
        });

        rootEl.addEventListener("submit", (e) => {
          e.preventDefault();
          const form = e.target;
          if (form.id === "modal-task-form" && state.modalTask) {
            const titulo = document.getElementById("modal-titulo").value.trim();
            if (!titulo) return;
            const descricao = document.getElementById("modal-descricao").value.trim();
            const prazoVal = document.getElementById("modal-prazo").value.trim();
            const urgencia = document.getElementById("modal-urgencia").value;
            const rotulo = document.getElementById("modal-rotulo").value.trim() || "Geral";
            const categoria = document.getElementById("modal-categoria").value.trim() || "Outro";
            const status = document.getElementById("modal-status").value;
            const statusNote = document.getElementById("modal-status-note").value.trim() || undefined;
            const observacoes = document.getElementById("modal-observacoes").value.trim() || undefined;
            const isCompleted = status === "Concluído";

            const base = state.modalTask;
            const updated = {
              ...base,
              titulo,
              descricao,
              prazo: prazoVal || null,
              urgencia,
              rotulo_aplicado: rotulo,
              categoria,
              status,
              statusNote,
              observacoes,
              completed: isCompleted,
              completedAt: isCompleted ? base.completedAt ?? new Date().toISOString() : undefined,
            };

            if (state.modalMode === "create") {
              if (!updated.historico_mensagens || updated.historico_mensagens.length === 0) {
                updated.historico_mensagens = [
                  {
                    id: `msg-${uuid()}`,
                    remetente_nome: "Criação manual",
                    remetente_email: "",
                    data_hora: getNowIsoDateTime(),
                    resumo: descricao || titulo,
                  },
                ];
              }
              state.tasks = [updated, ...state.tasks];
            } else {
              state.tasks = state.tasks.map((t) => (t.id === updated.id ? updated : t));
            }
            state.modalTask = null;
            void persistDemand(updated);
          } else if (form.id === "create-rule-form") {
            const matchType = document.getElementById("rule-match-type").value;
            const matchValue = document.getElementById("rule-match-value").value.trim();
            const rotulo = document.getElementById("rule-rotulo").value.trim();
            const categoria = document.getElementById("rule-categoria").value.trim() || "Outro";
            if (!matchValue || !rotulo) return;

            const newRule = {
              id: uuid(),
              ativo: true,
              matchType,
              matchValue,
              rotulo,
              categoria,
            };
            state.ruleFormMatchValue = "";
            state.ruleFormRotulo = "";
            state.rules = [newRule, ...state.rules];
            void persistRules(state.rules);
          } else if (form.id === "create-category-form") {
            const val = document.getElementById("new-category-input").value.trim();
            if (!val) return;
            if (!state.categories.some((c) => c.toLowerCase() === val.toLowerCase())) {
              state.categories = [...state.categories, val];
              saveStoredCategories(state.categories);
            }
            state.newCategoryInput = "";
            render();
          }
        });

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && state.modalTask) {
            state.modalTask = null;
            render();
          }
        });

        async function init() {
          render();
          try {
            const payload = await fetchInitialFromGas();
            applyGasPayload(payload);
            state.syncFeedback = `Dados carregados às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error
                ? err.message
                : "Não foi possível carregar os dados da Planilha Google.";
          } finally {
            state.isInitialLoading = false;
            render();
          }
        }

        init();
      })();
    </script>
  </body>
</html>
