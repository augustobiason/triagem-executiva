                  <span class="tabular-nums">${currentSelected.length} ${
                    currentSelected.length === 1 ? "selecionado" : "selecionados"
                  }</span>
                  <button type="button" data-action="close-picker"
                    class="font-medium text-blue-700 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300 cursor-pointer">
                    Concluir
                  </button>
                </div>
              </div>`
            : "";

          return `<div class="relative ${
            scope === "card" ? "inline-flex items-center" : "w-full"
          }" data-picker-root>${triggerHtml}${popoverHtml}</div>`;
        }

        function renderMultiTagInput({
          context,
          tags,
          draft,
          datalistId,
          placeholder,
          fallbackDisplay,
          useLabelColors,
          compact,
          inputId,
          ariaLabel,
        }) {
          const list = Array.isArray(tags) ? tags : [];
          const chipsHtml =
            list.length > 0
              ? list
                  .map((tag) => {
                    const styleAttr = useLabelColors
                      ? `style="${getLabelBadgeStyleAttr(tag, state.labelColors)}"`
                      : "";
                    const baseCls = useLabelColors
                      ? "border font-medium"
                      : "bg-slate-100 text-slate-700 border border-slate-200 dark:bg-slate-800 dark:text-slate-200 dark:border-slate-700 font-medium";
                    const sizeCls = compact
                      ? "px-1.5 py-0.5 text-[11px]"
                      : "px-2 py-0.5 text-xs";
                    return `
                      <span ${styleAttr} class="inline-flex items-center gap-1 rounded-md ${baseCls} ${sizeCls}">
                        <span>${escapeHtml(tag)}</span>
                        <button type="button" data-action="remove-tag-item" data-context="${escapeHtml(
                          context
                        )}" data-value="${escapeHtml(tag)}" aria-label="Remover ${escapeHtml(
                      tag
                    )}" class="opacity-70 hover:opacity-100 rounded transition-opacity cursor-pointer">
                          <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                      </span>
                    `;
                  })
                  .join("")
              : fallbackDisplay
              ? `<span class="text-[11px] text-slate-400 dark:text-slate-500 italic px-1">Padrão: ${escapeHtml(
                  fallbackDisplay
                )}</span>`
              : "";

          const inputSizeCls = compact ? "px-2 py-1 text-xs" : "px-2.5 py-1.5 text-sm";
          const btnSizeCls = compact ? "px-2 py-1 text-[11px]" : "px-2.5 py-1.5 text-xs";

          return `
            <div class="border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-900 p-1.5 space-y-1.5 focus-within:ring-2 focus-within:ring-blue-600/20 focus-within:border-blue-600 dark:focus-within:border-blue-500">
              <div class="flex flex-wrap items-center gap-1.5">${chipsHtml}</div>
              <div class="flex items-center gap-1.5">
                <input
                  ${inputId ? `id="${escapeHtml(inputId)}"` : ""}
                  type="text"
                  list="${escapeHtml(datalistId)}"
                  data-role="tag-input"
                  data-context="${escapeHtml(context)}"
                  value="${escapeHtml(draft || "")}"
                  placeholder="${escapeHtml(placeholder || "")}"
                  aria-label="${escapeHtml(ariaLabel || placeholder || "")}"
                  class="flex-1 min-w-0 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md focus:outline-none focus:bg-white dark:focus:bg-slate-950 focus:border-blue-500 ${inputSizeCls} text-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500"
                />
                <button type="button" data-action="add-tag-item" data-context="${escapeHtml(
                  context
                )}"
                  class="inline-flex items-center gap-1 font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 dark:text-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-md transition-colors whitespace-nowrap shrink-0 cursor-pointer ${btnSizeCls}">
                  <i data-lucide="plus" class="w-3 h-3"></i>
                  <span>Incluir</span>
                </button>
              </div>
            </div>
          `;
        }

        function renderStatusBadge(status) {
          const configs = {
            "A Fazer": {
              icon: "circle",
              classes:
                "bg-slate-100 text-slate-700 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700",
            },
            Iniciado: {
              icon: "play-circle",
              classes:
                "bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800/70",
            },
            Aguardando: {
              icon: "clock",
              classes:
                "bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800/70",
            },
            Concluído: {
              icon: "check-circle-2",
              classes:
                "bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800/70",
            },
          };
          const cfg = configs[status] || configs["A Fazer"];
          return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 text-xs font-medium rounded-md border whitespace-nowrap shrink-0 ${cfg.classes}">
            <i data-lucide="${cfg.icon}" class="w-3.5 h-3.5 shrink-0"></i>
            <span>${escapeHtml(status)}</span>
          </span>`;
        }

        function renderUrgencyIndicator(level) {
          const configs = {
            Alta: { text: "text-red-700 dark:text-red-400", dot: "bg-red-600 dark:bg-red-500" },
            Média: { text: "text-amber-700 dark:text-amber-400", dot: "bg-amber-500 dark:bg-amber-400" },
            Baixa: { text: "text-slate-600 dark:text-slate-400", dot: "bg-slate-400 dark:bg-slate-500" },
          };
          const cfg = configs[level] || configs["Baixa"];
          return `<span class="inline-flex items-center gap-1.5 text-xs font-medium whitespace-nowrap ${cfg.text}">
            <span class="w-2 h-2 rounded-full ${cfg.dot}"></span>
            <span>${escapeHtml(level)}</span>
          </span>`;
        }

        function renderSidebar() {
          const pendingCount = state.tasks.filter((t) => t.status !== "Concluído").length;
          const highCount = state.tasks.filter((t) => t.status !== "Concluído" && t.urgencia === "Alta").length;
          const waitingCount = state.tasks.filter((t) => t.status === "Aguardando").length;
          const unreadCount = state.tasks.filter((t) => t.hasNewMessage).length;
          const activeRulesCount = state.rules.filter((r) => r.ativo).length;

          return `
            <div class="flex flex-col h-full justify-between p-4">
              <div>
                <div class="px-2 py-2 mb-6">
                  <span class="font-display text-base font-bold tracking-tight text-slate-900 dark:text-slate-100 whitespace-nowrap">
                    Triagem Executiva
                  </span>
                </div>

                <nav aria-label="Navegação principal" class="space-y-1">
                  <button type="button" data-action="nav" data-view="tasks"
                    class="w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-lg transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                      state.view === "tasks"
                        ? "bg-blue-50 text-blue-700 dark:bg-blue-950/70 dark:text-blue-300"
                        : "text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800/80"
                    }">
                    <span class="inline-flex items-center gap-2.5">
                      <i data-lucide="list-checks" class="w-4 h-4 shrink-0"></i>
                      <span>Fila de Demandas</span>
                    </span>
                    <span class="font-mono tabular-nums text-xs text-slate-500 dark:text-slate-400">${pendingCount}</span>
                  </button>

                  <button type="button" data-action="nav" data-view="rules"
                    class="w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-lg transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                      state.view === "rules"
                        ? "bg-blue-50 text-blue-700 dark:bg-blue-950/70 dark:text-blue-300"
                        : "text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800/80"
                    }">
                    <span class="inline-flex items-center gap-2.5">
                      <i data-lucide="sliders-horizontal" class="w-4 h-4 shrink-0"></i>
                      <span>Regras e Configurações</span>
                    </span>
                    <span class="font-mono tabular-nums text-xs text-slate-500 dark:text-slate-400">${activeRulesCount}</span>
                  </button>
                </nav>

                <div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 px-2 space-y-3">
                  <div class="text-xs font-medium text-slate-500 dark:text-slate-400">Resumo da caixa</div>
                  <dl class="space-y-2 text-xs">
                    <div class="flex items-center justify-between">
                      <dt class="text-slate-600 dark:text-slate-400">Demandas pendentes</dt>
                      <dd class="font-mono tabular-nums font-semibold text-slate-900 dark:text-slate-100">${pendingCount}</dd>
                    </div>
                    <div class="flex items-center justify-between">
                      <dt class="text-slate-600 dark:text-slate-400">Urgência alta</dt>
                      <dd class="font-mono tabular-nums font-semibold text-red-700 dark:text-red-400">${highCount}</dd>
                    </div>
                    <div class="flex items-center justify-between">
                      <dt class="text-slate-600 dark:text-slate-400">Em aguardo</dt>
                      <dd class="font-mono tabular-nums font-semibold text-amber-700 dark:text-amber-400">${waitingCount}</dd>
                    </div>
                    <div class="flex items-center justify-between">
                      <dt class="text-slate-600 dark:text-slate-400">Novas mensagens</dt>
                      <dd class="font-mono tabular-nums font-semibold text-blue-700 dark:text-blue-400">${unreadCount}</dd>
                    </div>
                    <div class="flex items-center justify-between">
                      <dt class="text-slate-600 dark:text-slate-400">Regras ativas</dt>
                      <dd class="font-mono tabular-nums font-semibold text-slate-900 dark:text-slate-100">${activeRulesCount}</dd>
                    </div>
                  </dl>
                </div>
              </div>

              <div class="pt-4 border-t border-slate-200 dark:border-slate-800 px-2 text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                Sincronização integrada com Gmail e Planilha Google via Google Apps Script.
              </div>
            </div>
          `;
        }

        function renderTasksView() {
          if (state.isInitialLoading) {
            return `
              <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 rounded-xl p-12 flex flex-col items-center justify-center text-center">
                <i data-lucide="loader-2" class="w-6 h-6 text-blue-700 dark:text-blue-400 animate-spin mb-3"></i>
                <p class="text-sm font-medium text-slate-800 dark:text-slate-200">
                  Carregando demandas e regras da Planilha Google...
                </p>
              </section>
            `;
          }

          if (state.tasks.length === 0) {
            return `
              <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 rounded-xl p-12 flex flex-col items-center justify-center text-center">
                <div class="w-11 h-11 rounded-xl bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400 flex items-center justify-center mb-4">
                  <i data-lucide="list-checks" class="w-5 h-5"></i>
                </div>
                <h2 class="text-base font-semibold text-slate-900 dark:text-slate-100">Sua fila de demandas está vazia</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mt-1.5 leading-relaxed">
                  Clique em <strong class="font-medium text-slate-700 dark:text-slate-200">Sincronizar E-mails</strong> para
                  varrer novas mensagens do Gmail pelo Google Apps Script ou crie uma demanda manual.
                </p>
                <div class="mt-5 flex flex-wrap items-center justify-center gap-2.5">
                  <button type="button" data-action="sync-emails" ${state.isSyncing ? "disabled" : ""}
                    class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-blue-700 dark:bg-blue-600 rounded-lg hover:bg-blue-800 dark:hover:bg-blue-500 disabled:opacity-50 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
                    <i data-lucide="refresh-cw" class="w-4 h-4 ${state.isSyncing ? "animate-spin" : ""}"></i>
                    <span>${state.isSyncing ? "Sincronizando..." : "Sincronizar E-mails"}</span>
                  </button>
                  <button type="button" data-action="open-create-modal"
                    class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 dark:text-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700 transition-colors rounded-lg whitespace-nowrap shrink-0 cursor-pointer">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Criar demanda manual</span>
                  </button>
                </div>
              </section>
            `;
          }

          const counts = {
            Todos: 0,
            "A Fazer": 0,
            Iniciado: 0,
            Aguardando: 0,
            Concluído: 0,
          };
          for (const t of state.tasks) {
            const st = t.status ?? (t.completed ? "Concluído" : "A Fazer");
            counts[st] = (counts[st] ?? 0) + 1;
            if (st !== "Concluído") {
              counts.Todos += 1;
            }
          }

          const availableLabels = getAvailableLabels();
          const availableCategories = getAvailableCategories();
          const activeLabelFilter = getActiveLabelFilter(availableLabels);
          const activeCategoryFilter = getActiveCategoryFilter(availableCategories);
          const filtered = getFilteredTasks();

          const statusTabsHtml = STATUS_FILTER_OPTIONS.map((st) => {
            const active = state.statusFilter === st;
            return `<button type="button" data-action="status-filter" data-value="${escapeHtml(st)}"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                active
                  ? "bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-slate-100"
                  : "text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100"
              }">
              <span>${escapeHtml(st)}</span>
              <span class="font-mono tabular-nums text-[11px] text-slate-400 dark:text-slate-500">${counts[st]}</span>
            </button>`;
          }).join("");

          const urgencyTabsHtml = ["Todas", "Alta", "Média", "Baixa"]
            .map((lvl) => {
              const active = state.urgencyFilter === lvl;
              return `<button type="button" data-action="urgency-filter" data-value="${lvl}"
                class="px-2.5 py-1 text-xs font-medium rounded-md transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                  active
                    ? "bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-slate-100"
                    : "text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100"
                }">${lvl}</button>`;
            })
            .join("");

          let listHtml = "";
          if (filtered.length === 0) {
            const hasSecondaryFilters =
              Boolean(state.search.trim()) ||
              state.urgencyFilter !== "Todas" ||
              activeLabelFilter !== "Todos" ||
              activeCategoryFilter !== "Todas";
            if (hasSecondaryFilters) {
              listHtml = `
                <div class="py-12 px-6 text-center">
                  <p class="text-sm font-medium text-slate-800 dark:text-slate-200">
                    Nenhuma demanda corresponde aos filtros selecionados
                  </p>
                  <button type="button" data-action="clear-filters"
                    class="mt-3 px-3 py-1.5 text-xs font-medium text-blue-700 dark:text-blue-400 hover:underline cursor-pointer">
                    Limpar filtros
                  </button>
                </div>
              `;
            } else if (state.statusFilter === "Concluído") {
              listHtml = `
                <div class="py-12 px-6 text-center">
                  <p class="text-sm font-medium text-slate-800 dark:text-slate-200">
                    Nenhuma demanda concluída no momento
                  </p>
                  <button type="button" data-action="status-filter" data-value="Todos"
                    class="mt-3 px-3 py-1.5 text-xs font-medium text-blue-700 dark:text-blue-400 hover:underline cursor-pointer">
                    Ver demandas ativas
                  </button>
                </div>
              `;
            } else if (state.statusFilter === "Todos") {
              listHtml = `
                <div class="py-12 px-6 text-center">
                  <p class="text-sm font-medium text-slate-800 dark:text-slate-200">
                    Nenhuma demanda ativa no momento
                  </p>
                  ${
                    counts["Concluído"] > 0
                      ? `<button type="button" data-action="status-filter" data-value="Concluído"
                          class="mt-3 px-3 py-1.5 text-xs font-medium text-blue-700 dark:text-blue-400 hover:underline cursor-pointer">
                          Ver concluídos (${counts["Concluído"]})
                        </button>`
                      : ""
                  }
                </div>
              `;
            } else {
              listHtml = `
                <div class="py-12 px-6 text-center">
                  <p class="text-sm font-medium text-slate-800 dark:text-slate-200">
                    Nenhuma demanda com status &ldquo;${escapeHtml(state.statusFilter)}&rdquo;
                  </p>
                  <button type="button" data-action="status-filter" data-value="Todos"
                    class="mt-3 px-3 py-1.5 text-xs font-medium text-blue-700 dark:text-blue-400 hover:underline cursor-pointer">
                    Ver todas as demandas ativas
                  </button>
                </div>
              `;
            }
          } else {
            const viewedSet = new Set(state.viewedIds);
            listHtml = `<div class="divide-y divide-slate-200 dark:divide-slate-800">
              ${filtered
                .map((task) => {
                  const currentStatus = task.status ?? (task.completed ? "Concluído" : "A Fazer");
                  const isCompleted = currentStatus === "Concluído";
                  const isEditingObs = state.editingObsTaskId === task.id;
                  const isNewDemand = currentStatus === "A Fazer" && !viewedSet.has(task.id);
                  const isLabelPickerOpen = Boolean(
                    state.openCardPicker &&
                      state.openCardPicker.taskId === task.id &&
                      state.openCardPicker.type === "label"
                  );
                  const isCategoryPickerOpen = Boolean(
                    state.openCardPicker &&
                      state.openCardPicker.taskId === task.id &&
                      state.openCardPicker.type === "category"
                  );
                  const historyList = task.historico_mensagens || [];
                  const isCardExpanded = Boolean(state.expandedCards[task.id]) || isEditingObs;
                  const isExpanded = Boolean(state.expandedThreads[task.id]);

                  const newDemandBanner =
                    isNewDemand && !task.hasNewMessage
                      ? `<div class="mb-2.5 flex flex-wrap items-center justify-between gap-2">
                          <span class="inline-flex items-center gap-2 px-2 py-0.5 text-[11px] font-semibold text-emerald-800 bg-emerald-50 border border-emerald-200 dark:text-emerald-300 dark:bg-emerald-950/60 dark:border-emerald-800/70 rounded-md">
                            <span class="relative flex h-2 w-2 shrink-0" aria-hidden="true">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                            </span>
                            <span>Novo</span>
                          </span>
                          <button type="button" data-action="mark-viewed" data-id="${escapeHtml(task.id)}"
                            class="inline-flex items-center gap-1 text-xs font-medium text-emerald-700 hover:text-emerald-900 dark:text-emerald-400 dark:hover:text-emerald-300 hover:underline whitespace-nowrap shrink-0 cursor-pointer">
                            <i data-lucide="check" class="w-3.5 h-3.5"></i>
                            <span>Marcar como visto</span>
                          </button>
                        </div>`
                      : "";

                  const newMessageBanner = task.hasNewMessage
                    ? `<div class="mb-2.5 px-3 py-1.5 bg-blue-50 border border-blue-200 dark:bg-blue-950/50 dark:border-blue-800/70 rounded-lg flex flex-wrap items-center justify-between gap-2">
                        <span class="inline-flex items-center gap-2 text-xs font-semibold text-blue-800 dark:text-blue-200">
                          <i data-lucide="bell-ring" class="w-3.5 h-3.5 text-blue-700 dark:text-blue-400 shrink-0"></i>
                          <span>Nova mensagem na conversa</span>
                          ${
                            isNewDemand
                              ? `<span class="inline-flex items-center gap-1.5 px-1.5 py-0.5 text-[10px] font-semibold text-emerald-800 bg-emerald-50 border border-emerald-200 dark:text-emerald-300 dark:bg-emerald-950/60 dark:border-emerald-800/70 rounded">
                                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500" aria-hidden="true"></span>
                                  <span>Novo</span>
                                </span>`
                              : ""
                          }
                        </span>
                        <button type="button" data-action="mark-seen" data-id="${escapeHtml(task.id)}"
                          class="inline-flex items-center gap-1 text-xs font-medium text-blue-700 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300 hover:underline whitespace-nowrap shrink-0 cursor-pointer">
                          <i data-lucide="check" class="w-3.5 h-3.5"></i>
                          <span>Marcar como visto</span>
                        </button>
                      </div>`
                    : "";

                  const savedFeedbackKind = state.savedNoteFeedback[task.id];
                  const savedFeedbackHtml = `<span role="status" class="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-700 dark:text-emerald-400"><i data-lucide="check" class="w-3 h-3"></i><span>Salvo</span></span>`;

                  const waitingFieldHtml =
                    currentStatus === "Aguardando"
                      ? `<div class="pt-0.5 max-w-xl">
                          <div class="flex items-center justify-between gap-2 mb-1">
                            <label for="waiting-note-${escapeHtml(task.id)}" class="flex items-center gap-1.5 text-xs font-medium text-amber-800 dark:text-amber-300">
                              <i data-lucide="message-square-text" class="w-3.5 h-3.5 shrink-0"></i>
                              <span>Motivo / pendência em aguardo</span>
                            </label>
                            ${savedFeedbackKind === "waiting" ? savedFeedbackHtml : ""}
                          </div>
                          <div class="flex items-center gap-2">
                            <input id="waiting-note-${escapeHtml(task.id)}" type="text"
                              data-role="waiting-note" data-id="${escapeHtml(task.id)}"
                              value="${escapeHtml(task.statusNote || "")}"
                              placeholder="Aguardando retorno de... (ex: aprovação do jurídico)"
                              class="flex-1 min-w-0 px-3 py-1.5 text-xs text-slate-900 bg-amber-50/60 border border-amber-200 placeholder:text-amber-700/60 focus:outline-none focus:bg-white focus:ring-2 focus:ring-amber-500/25 focus:border-amber-400 dark:text-slate-100 dark:bg-amber-950/35 dark:border-amber-800/70 dark:placeholder:text-amber-300/60 dark:focus:bg-slate-950 dark:focus:border-amber-500 rounded-lg" />
                            <button type="button" data-action="save-waiting-note" data-waiting-action="save" data-id="${escapeHtml(task.id)}"
                              class="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs font-medium text-white bg-amber-700 dark:bg-amber-600 rounded-lg hover:bg-amber-800 dark:hover:bg-amber-500 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
                              <i data-lucide="check" class="w-3.5 h-3.5"></i>
                              <span>Salvar motivo</span>
                            </button>
                          </div>
                        </div>`
                      : task.statusNote
                      ? `<div class="flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400">
                          <i data-lucide="message-square-text" class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500 shrink-0"></i>
                          <span>Pendência registrada: ${escapeHtml(task.statusNote)}</span>
                        </div>`
                      : "";

                  let obsHtml = "";
                  if (isEditingObs) {
                    obsHtml = `
                      <div class="space-y-1.5">
                        <label for="obs-input-${escapeHtml(task.id)}" class="flex items-center gap-1.5 text-xs font-medium text-slate-700 dark:text-slate-300">
                          <i data-lucide="notebook-pen" class="w-3.5 h-3.5 text-blue-700 dark:text-blue-400 shrink-0"></i>
                          <span>Observações e acompanhamento</span>
                        </label>
                        <div class="flex items-center gap-2">
                          <input id="obs-input-${escapeHtml(task.id)}" type="text"
                            data-role="obs-input" data-id="${escapeHtml(task.id)}"
                            value="${escapeHtml(state.obsDraft)}"
                            placeholder="Ex: Alinhado com Carlos em 17/11; aguardando versão final..."
                            class="flex-1 min-w-0 px-3 py-1.5 text-xs text-slate-900 bg-white border border-blue-300 dark:text-slate-100 dark:bg-slate-950 dark:border-blue-600 dark:placeholder:text-slate-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 dark:focus:border-blue-500" />
                          <button type="button" data-action="save-obs" data-id="${escapeHtml(task.id)}"
                            class="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs font-medium text-white bg-blue-700 dark:bg-blue-600 rounded-lg hover:bg-blue-800 dark:hover:bg-blue-500 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
                            <i data-lucide="check" class="w-3.5 h-3.5"></i>
                            <span>Salvar</span>
                          </button>
                          <button type="button" data-action="cancel-obs" data-obs-action="cancel"
                            aria-label="Cancelar edição da observação"
                            class="p-1.5 text-slate-500 hover:text-slate-800 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 dark:text-slate-400 dark:hover:text-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors cursor-pointer">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                    `;
                  } else if (task.observacoes) {
                    obsHtml = `
                      <div class="flex items-start gap-2 px-3 py-2 bg-slate-50 border border-slate-200/80 dark:bg-slate-800/70 dark:border-slate-700/80 rounded-lg text-xs text-slate-700 dark:text-slate-300">
                        <i data-lucide="notebook-pen" class="w-3.5 h-3.5 text-slate-500 dark:text-slate-400 mt-0.5 shrink-0"></i>
                        <div class="min-w-0 flex-1 leading-relaxed">
                          <span class="font-medium text-slate-800 dark:text-slate-100">Observações: </span>
                          <span>${escapeHtml(task.observacoes)}</span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                          ${savedFeedbackKind === "obs" ? savedFeedbackHtml : ""}
                          <button type="button" data-action="edit-obs" data-id="${escapeHtml(task.id)}"
                            class="text-xs font-medium text-blue-700 dark:text-blue-400 hover:underline whitespace-nowrap shrink-0 cursor-pointer">
                            Editar nota
                          </button>
                        </div>
                      </div>
                    `;
                  } else {
                    obsHtml = `
                      <div class="flex items-center gap-3">
                        <button type="button" data-action="edit-obs" data-id="${escapeHtml(task.id)}"
                          class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-500 hover:text-blue-700 dark:text-slate-400 dark:hover:text-blue-400 transition-colors cursor-pointer">
                          <i data-lucide="notebook-pen" class="w-3.5 h-3.5"></i>
                          <span>Adicionar observação</span>
                        </button>
                        ${savedFeedbackKind === "obs" ? savedFeedbackHtml : ""}
                      </div>
                    `;
                  }

                  const threadAccordionBtn =
                    historyList.length > 0
                      ? `<span aria-hidden="true">·</span>
                         <button type="button" data-action="toggle-thread" data-id="${escapeHtml(task.id)}"
                           class="inline-flex items-center gap-1 font-medium text-slate-700 hover:text-blue-700 dark:text-slate-300 dark:hover:text-blue-400 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
                           <i data-lucide="messages-square" class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500"></i>
                           <span class="tabular-nums">${historyList.length} ${
                             historyList.length === 1 ? "mensagem na conversa" : "mensagens na conversa"
                           }</span>
                           <i data-lucide="${isExpanded ? "chevron-up" : "chevron-down"}" class="w-3.5 h-3.5"></i>
                         </button>`
                      : "";

                  const threadDrawerHtml =
                    isExpanded && historyList.length > 0
                      ? `<div class="mt-2 border border-slate-200 rounded-lg bg-slate-50/70 divide-y divide-slate-200/80 dark:border-slate-700 dark:bg-slate-800/50 dark:divide-slate-700/80 max-w-3xl">
                          ${historyList
                            .map(
                              (msg, idx) => `
                            <div class="px-3.5 py-2.5 text-xs space-y-1">
                              <div class="flex flex-wrap items-center justify-between gap-2">
                                <span class="font-medium text-slate-800 dark:text-slate-200">
                                  <span class="font-mono tabular-nums text-slate-400 dark:text-slate-500 mr-1.5 font-normal">${String(
                                    idx + 1
                                  ).padStart(2, "0")}.</span>
                                  ${escapeHtml(msg.remetente_nome)}${
                                    msg.remetente_email ? ` (${escapeHtml(msg.remetente_email)})` : ""
                                  }
                                </span>
                                <span class="font-mono tabular-nums text-slate-500 dark:text-slate-400">
                                  ${escapeHtml(
                                    formatReceivedDateTime(msg.data_hora, undefined, "Sem data")
                                  )}
                                </span>
                              </div>
                              <p class="text-slate-600 dark:text-slate-300 leading-relaxed pl-6">${escapeHtml(msg.resumo)}</p>
                            </div>
                          `
                            )
                            .join("")}
                        </div>`
                      : "";

                  const statusOptionsHtml = TASK_STATUS_OPTIONS.map(
                    (opt) =>
                      `<option value="${escapeHtml(opt)}" ${
                        currentStatus === opt ? "selected" : ""
                      }>${escapeHtml(opt)}</option>`
                  ).join("");

                  const taskLabels = getTaskLabels(task);
                  const taskCategories = getTaskCategories(task);
                  const cardSurfaceClass = task.hasNewMessage
                    ? "border-l-4 border-l-blue-600 bg-blue-50/35 dark:border-l-blue-500 dark:bg-blue-950/20"
                    : isNewDemand
                    ? "border-l-4 border-l-emerald-500 bg-emerald-50/20 dark:border-l-emerald-500 dark:bg-emerald-950/15"
                    : isCompleted
                    ? "bg-slate-50/40 dark:bg-slate-900/50"
                    : "";

                  const expandedDetailsHtml = isCardExpanded
                    ? `<div class="pt-2 space-y-2.5 animate-card-details">
                        ${
                          task.descricao
                            ? `<p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed max-w-3xl whitespace-pre-line">${escapeHtml(
                                task.descricao
                              )}</p>`
                            : ""
                        }
                        ${waitingFieldHtml}
                        <div class="max-w-2xl">${obsHtml}</div>
                      </div>`
                    : "";

                  return `
                    <article class="p-4 sm:px-6 transition-colors hover:bg-slate-50/60 dark:hover:bg-slate-800/40 ${cardSurfaceClass}">
                      ${newDemandBanner}
                      ${newMessageBanner}
                      <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4">
                        <div class="min-w-0 flex-1 space-y-2">
                          <div class="flex flex-wrap items-center gap-2">
                            ${renderStatusBadge(currentStatus)}
                            ${renderUrgencyIndicator(task.urgencia)}
                            <span aria-hidden="true" class="text-slate-300 dark:text-slate-600 text-xs">·</span>
                            ${renderCheckboxPopover({
                              scope: "card",
                              taskId: task.id,
                              mode: "label",
                              selected: taskLabels,
                              options: availableLabels,
                              isOpen: isLabelPickerOpen,
                            })}
                            <span aria-hidden="true" class="text-slate-300 dark:text-slate-600 text-xs">·</span>
                            ${renderCheckboxPopover({
                              scope: "card",
                              taskId: task.id,
                              mode: "category",
                              selected: taskCategories,
                              options: availableCategories,
                              isOpen: isCategoryPickerOpen,
                            })}
                            <span aria-hidden="true" class="text-slate-300 dark:text-slate-600 text-xs">·</span>
                            ${renderDeadlineBadge(task.prazo, isCompleted)}
                          </div>

                          <div>
                            <button type="button" data-action="toggle-card" data-id="${escapeHtml(task.id)}"
                              aria-expanded="${isCardExpanded ? "true" : "false"}"
                              class="group w-full flex items-start justify-between gap-2 text-left rounded-md -mx-1.5 px-1.5 py-0.5 hover:bg-slate-100/75 dark:hover:bg-slate-800/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/25 transition-colors cursor-pointer">
                              <h3 class="text-sm font-semibold leading-snug transition-colors ${
                                isCompleted
                                  ? "line-through text-slate-500 dark:text-slate-500"
                                  : "text-slate-900 group-hover:text-blue-800 dark:text-slate-100 dark:group-hover:text-blue-300"
                              }">${escapeHtml(task.titulo)}</h3>
                              <i data-lucide="chevron-down" class="w-4 h-4 shrink-0 mt-0.5 transition-transform duration-200 ${
                                isCardExpanded
                                  ? "rotate-180 text-blue-700 dark:text-blue-400"
                                  : "text-slate-400 group-hover:text-slate-600 dark:text-slate-500 dark:group-hover:text-slate-300"
                              }"></i>
                            </button>
                            ${expandedDetailsHtml}
                          </div>

                          <div class="space-y-1 pt-0.5">
                            <div class="text-xs text-slate-500 dark:text-slate-400 flex flex-wrap items-center gap-x-2.5 gap-y-1">
                              <span>Solicitante: ${escapeHtml(task.solicitante_nome)}</span>
                              <span aria-hidden="true">·</span>
                              <span class="inline-flex items-center gap-1 font-mono tabular-nums text-slate-600 dark:text-slate-300">
                                <i data-lucide="clock" class="w-3 h-3 text-slate-400 dark:text-slate-500"></i>
                                <span>Recebido em ${escapeHtml(
                                  formatReceivedDateTime(
                                    task.data_hora_email_original,
                                    task.data_email_original,
                                    "Sem data"
                                  )
                                )}</span>
                              </span>
                              ${threadAccordionBtn}
                            </div>

                            <div class="text-xs text-slate-600 dark:text-slate-300 flex items-start gap-1.5 min-w-0">
                              <i data-lucide="mail" class="w-3 h-3 text-slate-400 dark:text-slate-500 shrink-0 mt-0.5"></i>
                              <p class="min-w-0 break-words leading-snug">
                                <span class="font-medium text-slate-700 dark:text-slate-200">Assunto: </span>
                                <span>${escapeHtml(
                                  task.assunto_normalizado || task.assunto_original || "Sem assunto"
                                )}</span>
                              </p>
                            </div>
                          </div>

                          ${threadDrawerHtml}
                        </div>

                        <div class="flex flex-wrap items-center gap-2 shrink-0">
                          <select data-role="task-status-select" data-id="${escapeHtml(task.id)}"
                            aria-label="Alterar status de ${escapeHtml(task.titulo)}"
                            class="px-2.5 py-1.5 text-xs font-medium text-slate-800 bg-white border border-slate-200 hover:border-slate-300 dark:text-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:hover:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 dark:focus:border-blue-500 cursor-pointer">
                            ${statusOptionsHtml}
                          </select>
                          <button type="button" data-action="open-edit-modal" data-id="${escapeHtml(task.id)}"
                            class="inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 dark:text-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700 rounded-lg transition-colors whitespace-nowrap shrink-0 cursor-pointer">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                            <span>Editar</span>
                          </button>
                          <button type="button" data-action="request-delete-task" data-id="${escapeHtml(task.id)}"
                            title="Excluir demanda definitivamente" aria-label="Excluir ${escapeHtml(task.titulo)}"
                            class="p-1.5 text-slate-400 hover:text-red-700 rounded-lg hover:bg-red-50 dark:text-slate-500 dark:hover:text-red-400 dark:hover:bg-red-950/50 transition-colors cursor-pointer">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                    </article>
                  `;
                })
                .join("")}
            </div>`;
          }

          return `
            <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 rounded-xl flex flex-col">
              <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex flex-col gap-3">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div role="tablist" aria-label="Filtrar demandas por status"
                    class="flex flex-wrap items-center gap-1 p-1 bg-slate-100 dark:bg-slate-800/90 rounded-lg">
                    ${statusTabsHtml}
                  </div>
                  <div class="flex flex-wrap items-center gap-2">
                    <button type="button" data-action="open-create-modal"
                      class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-white bg-blue-700 dark:bg-blue-600 rounded-lg hover:bg-blue-800 dark:hover:bg-blue-500 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
                      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                      <span>Nova demanda</span>
                    </button>
                    <button type="button" data-action="export-csv" ${
                      filtered.length === 0 ? "disabled" : ""
                    }
                      class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 dark:text-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700 disabled:opacity-40 rounded-lg transition-colors whitespace-nowrap shrink-0 cursor-pointer">
                      <i data-lucide="download" class="w-3.5 h-3.5"></i>
                      <span>Exportar CSV</span>
                    </button>
                  </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div class="flex flex-wrap items-center gap-2.5 flex-1 min-w-[240px]">
                    <div class="relative flex-1 min-w-[220px] max-w-md">
                      <i data-lucide="search" class="w-4 h-4 text-slate-400 dark:text-slate-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                      <input type="search" id="task-search-input" value="${escapeHtml(state.search)}"
                        placeholder="Buscar demanda, rótulo, observação ou histórico..."
                        class="w-full pl-9 pr-3 py-1.5 text-sm text-slate-900 bg-slate-50 border border-slate-200 focus:bg-white focus:border-blue-600 dark:text-slate-100 dark:bg-slate-800 dark:border-slate-700 dark:placeholder:text-slate-500 dark:focus:bg-slate-950 dark:focus:border-blue-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600/20" />
                    </div>
                    <div class="relative flex items-center">
                      <i data-lucide="tag" class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500 absolute left-2.5 pointer-events-none"></i>
                      <label for="filter-rotulo-select" class="sr-only">Filtrar por rótulo</label>
                      <select id="filter-rotulo-select" data-role="label-filter"
                        class="pl-8 pr-7 py-1.5 text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 hover:bg-white focus:bg-white focus:border-blue-600 dark:text-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700 dark:focus:bg-slate-950 dark:focus:border-blue-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600/20 cursor-pointer">
                        <option value="Todos" ${activeLabelFilter === "Todos" ? "selected" : ""}>Todos os rótulos</option>
                        ${availableLabels

        async function persistDemand(updatedTask) {
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            await postUpdateDemandToGas(updatedTask);
            state.syncFeedback = `Salvo na planilha às ${formatCurrentTime()}`;
            return true;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao salvar demanda na planilha.";
            return false;
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistDeleteDemand(taskId) {
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            await postDeleteDemandToGas(taskId);
            state.syncFeedback = `Demanda excluída às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao excluir demanda na planilha.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistNewDemand(newTask) {
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            const responsePayload = await postCreateDemandToGas(newTask);
            if (responsePayload && responsePayload.demandas) {
              const excluded = new Set(loadStoredIdList(STORAGE_DELETED_IDS_KEY));
              const nextTasks = responsePayload.demandas.filter(
                (d) => !excluded.has(d.id)
              );
              const nextRules = responsePayload.regras || state.rules;
              state.tasks = nextTasks;
              if (responsePayload.regras) {
                state.rules = nextRules;
              }
              state.categories = mergeCategoryLists(
                state.categories,
                responsePayload.categorias || [],
                nextRules,
                nextTasks,
                state.deletedCategories
              );
              saveStoredCategories(state.categories);
              state.labels = mergeLabelLists(
                state.labels.length > 0 ? state.labels : ["Geral"],
                nextRules,
                nextTasks
              );
              saveStoredLabels(state.labels);
            }
            state.syncFeedback = `Demanda criada na planilha às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao criar demanda na planilha.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistRules(nextRules) {
          state.isSaving = true;
          state.apiError = null;
          state.rulesSavedFeedback = null;
          render();
          try {
            await postSaveRulesToGas(nextRules);
            const timeLabel = formatCurrentTime();
            state.syncFeedback = `Regras salvas na planilha às ${timeLabel}`;
            state.rulesSavedFeedback = `Regras salvas na planilha às ${timeLabel}`;
          } catch (err) {
            state.apiError =
              err instanceof Error ? err.message : "Erro ao salvar regras na planilha.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        async function persistRenamedOrDeletedLabel(nextRules, updatedTasks) {
          if (!nextRules && updatedTasks.length === 0) {
            render();
            return;
          }
          state.isSaving = true;
          state.apiError = null;
          render();
          try {
            const promises = [];
            if (nextRules) {
              promises.push(postSaveRulesToGas(nextRules));
            }
            for (const task of updatedTasks) {
              promises.push(postUpdateDemandToGas(task));
            }
            await Promise.all(promises);
            state.syncFeedback = `Rótulos sincronizados às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error
                ? err.message
                : "Não foi possível sincronizar o rótulo atualizado na Planilha Google.";
          } finally {
            state.isSaving = false;
            render();
          }
        }

        function commitLabelItemEdit(oldLabel) {
          const cleaned = state.labelItemDraft.trim();
          state.editingLabelItem = null;
          state.labelItemDraft = "";
          if (!cleaned || oldLabel === "Geral" || cleaned === oldLabel) {
            render();
            return;
          }

          const replaced = state.labels.map((lbl) => (lbl === oldLabel ? cleaned : lbl));
          state.labels = mergeLabelLists(replaced, [], []);
          saveStoredLabels(state.labels);

          const nextColors = { ...state.labelColors };
          const oldColor = findLabelColorHex(oldLabel, nextColors);
          for (const k of Object.keys(nextColors)) {
            if (k.toLowerCase() === oldLabel.toLowerCase()) delete nextColors[k];
          }
          if (oldColor) {
            nextColors[cleaned] = oldColor;
          }
          state.labelColors = nextColors;
          saveStoredLabelColors(nextColors);
          if (state.colorPickerLabel === oldLabel) {
            state.colorPickerLabel = cleaned;
          }

          let rulesChanged = false;
          const nextRules = state.rules.map((r) => {
            const items = parseMultiValueField(r.rotulo, "Geral");
            if (items.includes(oldLabel)) {
              rulesChanged = true;
              const updatedList = normalizeTagList(
                items.map((i) => (i === oldLabel ? cleaned : i)),
                "Geral"
              );
              return { ...r, rotulo: updatedList.join(", ") };
            }
            return r;
          });
          if (rulesChanged) {
            state.rules = nextRules;
          }

          const updatedTasks = [];
          const nextTasks = state.tasks.map((t) => {
            const items = getTaskLabels(t);
            if (items.includes(oldLabel)) {
              const updatedList = normalizeTagList(
                items.map((i) => (i === oldLabel ? cleaned : i)),
                "Geral"
              );
              const updated = {
                ...t,
                rotulos: updatedList,
                rotulo_aplicado: updatedList.join(", "),
              };
              updatedTasks.push(updated);
              return updated;
            }
            return t;
          });
          if (updatedTasks.length > 0) {
            state.tasks = nextTasks;
          }

          if (state.labelFilter === oldLabel) {
            state.labelFilter = cleaned;
          }

          void persistRenamedOrDeletedLabel(
            rulesChanged ? nextRules : null,
            updatedTasks
          );
        }

        function deleteLabelItem(labelToDelete) {
          if (labelToDelete === "Geral") return;
          state.labels = state.labels.filter((lbl) => lbl !== labelToDelete);
          saveStoredLabels(state.labels);

          const nextColors = { ...state.labelColors };
          for (const k of Object.keys(nextColors)) {
            if (k.toLowerCase() === labelToDelete.toLowerCase()) delete nextColors[k];
          }
          state.labelColors = nextColors;
          saveStoredLabelColors(nextColors);
          if (state.colorPickerLabel === labelToDelete) {
            state.colorPickerLabel = null;
          }

          let rulesChanged = false;
          const nextRules = state.rules.map((r) => {
            const items = parseMultiValueField(r.rotulo, "Geral");
            if (items.includes(labelToDelete)) {
              rulesChanged = true;
              const remaining = items.filter((i) => i !== labelToDelete);
              const updatedList = remaining.length > 0 ? remaining : ["Geral"];
              return { ...r, rotulo: updatedList.join(", ") };
            }
            return r;
          });
          if (rulesChanged) {
            state.rules = nextRules;
          }

          const updatedTasks = [];
          const nextTasks = state.tasks.map((t) => {
            const items = getTaskLabels(t);
            if (items.includes(labelToDelete)) {
              const remaining = items.filter((i) => i !== labelToDelete);
              const updatedList = remaining.length > 0 ? remaining : ["Geral"];
              const updated = {
                ...t,
                rotulos: updatedList,
                rotulo_aplicado: updatedList.join(", "),
              };
              updatedTasks.push(updated);
              return updated;
            }
            return t;
          });
          if (updatedTasks.length > 0) {
            state.tasks = nextTasks;
          }

          if (state.labelFilter === labelToDelete) {
            state.labelFilter = "Todos";
          }

          void persistRenamedOrDeletedLabel(
            rulesChanged ? nextRules : null,
            updatedTasks
          );
        }

        function setLabelColor(label, hex) {
          const next = { ...state.labelColors };
          for (const k of Object.keys(next)) {
            if (k.toLowerCase() === label.toLowerCase()) delete next[k];
          }
          if (hex && /^#[0-9a-f]{6}$/i.test(hex)) {
            next[label] = hex.toLowerCase();
          }
          state.labelColors = next;
          saveStoredLabelColors(next);
        }

        async function handleSyncEmails() {

        function exportCsv() {
          const filtered = getFilteredTasks();
          const headers = [
            "Status",
            "Observação do Status",
            "Observações e Acompanhamento",
            "Mensagens na Conversa",
            "Título",
            "Descrição",
            "Urgência",
            "Prazo",
            "Prazo Original",
            "Categorias",
            "Rótulos Aplicados",
            "Regra Acionada",
            "Solicitante",
            "E-mail Solicitante",
            "Assunto Original",
            "Recebido em (Data/Hora)",
          ];
          const escapeCell = (val) => `"${String(val ?? "").replace(/"/g, '""')}"`;
          const rows = filtered.map((t) =>
            [
              t.status ?? (t.completed ? "Concluído" : "A Fazer"),
              t.statusNote ?? "",
              t.observacoes ?? "",
              (t.historico_mensagens || []).length || 1,
              t.titulo,
              t.descricao,
              t.urgencia,
              t.prazo ?? "",
              t.prazo_texto_original ?? "",
              getTaskCategories(t).join(", "),
              getTaskLabels(t).join(", "),
              t.regra_acionada ? "Sim" : "Não",
              t.solicitante_nome,
              t.solicitante_email,
              t.assunto_original,
              t.data_hora_email_original || t.data_email_original,
            ]
              .map(escapeCell)
              .join(",")
          );
          const csv = "\uFEFF" + [headers.map(escapeCell).join(","), ...rows].join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `fila-demandas-${new Date().toISOString().slice(0, 10)}.csv`;
          link.click();
          URL.revokeObjectURL(url);
        }

        function flashSavedNoteFeedback(taskId, kind) {
          state.savedNoteFeedback[taskId] = kind;
          if (state.savedNoteTimers[taskId]) {
            window.clearTimeout(state.savedNoteTimers[taskId]);
          }
          render();
          state.savedNoteTimers[taskId] = window.setTimeout(() => {
            delete state.savedNoteFeedback[taskId];
            delete state.savedNoteTimers[taskId];
            render();
          }, 2600);
        }

        async function commitWaitingNote(taskId, rawValue, forceSave = false) {
          const task = state.tasks.find((t) => t.id === taskId);
          if (!task) return;
          markTaskAsViewed(taskId);
          const raw = rawValue !== undefined ? String(rawValue) : String(task.statusNote || "");
          const trimmed = raw.trim();
          const baseline = String(task.observacoes ?? "").trim();
          if (!forceSave && trimmed === baseline) {
            return;
          }
          const cleaned = trimmed || undefined;
          const updated = {
            ...task,
            statusNote: cleaned,
            motivo_aguardo: cleaned,
            observacao_status: cleaned,
            observacoes: cleaned,
          };
          state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
          const ok = await persistDemand(updated);
          if (ok) {
            flashSavedNoteFeedback(taskId, "waiting");
          }
        }

        async function commitObs(taskId) {
          const task = state.tasks.find((t) => t.id === taskId);
          state.editingObsTaskId = null;
          if (!task) {
            render();
            return;
          }
          const trimmed = state.obsDraft.trim();
          const cleaned = trimmed || undefined;
          if (
            (task.observacoes ?? undefined) === cleaned &&
            (task.motivo_aguardo ?? undefined) === cleaned &&
            (task.statusNote ?? undefined) === cleaned
          ) {
            render();
            return;
          }
          const updated = {
            ...task,
            observacoes: cleaned,
            motivo_aguardo: cleaned,
            observacao_status: cleaned,
            statusNote: cleaned,
          };
          state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
          const ok = await persistDemand(updated);
          if (ok) {
            flashSavedNoteFeedback(taskId, "obs");
          }
        }

        function togglePickerOption(optionValue) {
          if (state.openModalPickerType && state.modalTask) {
            const isLabel = state.openModalPickerType === "label";
            const fallback = isLabel ? "Geral" : "Outro";
            const current = normalizeTagList(
              isLabel ? state.modalRotulos : state.modalCategorias,
              fallback
            );
            const exists = current.some(
              (item) => item.toLowerCase() === optionValue.toLowerCase()
            );
            let nextList;
            if (exists) {
              const filtered = current.filter(
                (item) => item.toLowerCase() !== optionValue.toLowerCase()
              );
              nextList = filtered.length > 0 ? filtered : [fallback];
            } else {
              nextList = normalizeTagList([...current, optionValue], fallback);
            }
            if (isLabel) {
              state.modalRotulos = nextList;
            } else {
              state.modalCategorias = nextList;
            }
            render();
            return;
          }

          if (state.openCardPicker) {
            const { taskId, type } = state.openCardPicker;
            const task = state.tasks.find((t) => t.id === taskId);
            if (!task) return;
            const isLabel = type === "label";
            const fallback = isLabel ? "Geral" : "Outro";
            const current = isLabel ? getTaskLabels(task) : getTaskCategories(task);
            const exists = current.some(
              (item) => item.toLowerCase() === optionValue.toLowerCase()
            );
            let nextList;
            if (exists) {
              const filtered = current.filter(
                (item) => item.toLowerCase() !== optionValue.toLowerCase()
              );
              nextList = filtered.length > 0 ? filtered : [fallback];
            } else {
              nextList = normalizeTagList([...current, optionValue], fallback);
            }
            const nextJoined = nextList.join(", ");
            if (nextJoined === current.join(", ")) {
              render();
              return;
            }
            const updated = isLabel
              ? { ...task, rotulos: nextList, rotulo_aplicado: nextJoined }
              : { ...task, categorias: nextList, categoria: nextJoined };
            state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
            void persistDemand(updated);
          }
        }

        function addNewOptionFromPicker() {
          const trimmed = state.pickerNewDraft.trim();
          if (!trimmed) {
            state.pendingFocusPickerInput = true;
            render();
            return;
          }

          if (state.openModalPickerType && state.modalTask) {
            const isLabel = state.openModalPickerType === "label";
            const fallback = isLabel ? "Geral" : "Outro";
            if (isLabel) {
              ensureLabelsTracked([trimmed]);
              state.modalRotulos = normalizeTagList([...state.modalRotulos, trimmed], fallback);
            } else {
              ensureCategoriesTracked([trimmed]);
              state.modalCategorias = normalizeTagList(
                [...state.modalCategorias, trimmed],
                fallback
              );
            }
            state.pickerNewDraft = "";
            state.pendingFocusPickerInput = true;
            render();
            return;
          }

          if (state.openCardPicker) {
            const { taskId, type } = state.openCardPicker;
            const task = state.tasks.find((t) => t.id === taskId);
            if (!task) return;
            const isLabel = type === "label";
            const fallback = isLabel ? "Geral" : "Outro";
            if (isLabel) {
              ensureLabelsTracked([trimmed]);
            } else {
              ensureCategoriesTracked([trimmed]);
            }
            const current = isLabel ? getTaskLabels(task) : getTaskCategories(task);
            const nextList = normalizeTagList([...current, trimmed], fallback);
            const nextJoined = nextList.join(", ");
            state.pickerNewDraft = "";
            state.pendingFocusPickerInput = true;

            if (nextJoined === current.join(", ")) {
              render();
              return;
            }
            const updated = isLabel
              ? { ...task, rotulos: nextList, rotulo_aplicado: nextJoined }
              : { ...task, categorias: nextList, categoria: nextJoined };
            state.tasks = state.tasks.map((t) => (t.id === taskId ? updated : t));
            void persistDemand(updated);
          }
        }

        function getTagContextConfig(context) {
          if (context === "rule-rotulo") {
            return {
              getList: () => state.ruleFormRotulos,
              setList: (v) => { state.ruleFormRotulos = v; },
              getDraft: () => state.ruleFormRotuloDraft,
              setDraft: (v) => { state.ruleFormRotuloDraft = v; },
            };
          }
          if (context === "rule-categoria") {
            return {
              getList: () => state.ruleFormCategorias,
              setList: (v) => { state.ruleFormCategorias = v; },
              getDraft: () => state.ruleFormCategoriaDraft,
              setDraft: (v) => { state.ruleFormCategoriaDraft = v; },
            };
          }
          if (context === "edit-rule-rotulo" && state.editRuleDraft) {
            return {
              getList: () => state.editRuleDraft.rotulos || [],
              setList: (v) => { if (state.editRuleDraft) state.editRuleDraft.rotulos = v; },
              getDraft: () => state.editRuleRotuloDraft,
              setDraft: (v) => { state.editRuleRotuloDraft = v; },
            };
          }
          if (context === "edit-rule-categoria" && state.editRuleDraft) {
            return {
              getList: () => state.editRuleDraft.categorias || [],
              setList: (v) => { if (state.editRuleDraft) state.editRuleDraft.categorias = v; },
              getDraft: () => state.editRuleCategoriaDraft,
              setDraft: (v) => { state.editRuleCategoriaDraft = v; },
            };
          }
          return null;
        }

        function addTagToContext(context, rawText, refocus) {
          const cfg = getTagContextConfig(context);
          if (!cfg) return false;
          const parts = String(rawText ?? "")
            .split(",")
            .map((p) => p.trim())
            .filter(Boolean);
          if (parts.length === 0) return false;
          const next = normalizeTagList([...cfg.getList(), ...parts]);
          cfg.setList(next);
          cfg.setDraft("");
          if (refocus) state.pendingFocusTagContext = context;
          return true;
        }

        function removeTagFromContext(context, value) {
          const cfg = getTagContextConfig(context);
          if (!cfg) return;
          cfg.setList(cfg.getList().filter((item) => item !== value));
        }

        const rootEl = document.getElementById("app");

        rootEl.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const action = btn.dataset.action;

          if (action === "nav") {
            state.view = btn.dataset.view;
            state.mobileMenuOpen = false;
            render();
          } else if (action === "open-mobile-menu") {
            state.mobileMenuOpen = true;
            render();
          } else if (action === "close-mobile-menu") {
            state.mobileMenuOpen = false;
            render();
          } else if (action === "toggle-theme") {
            state.theme = state.theme === "dark" ? "light" : "dark";
            applyTheme(state.theme);
            render();
          } else if (action === "sync-emails") {
            void handleSyncEmails();
          } else if (action === "dismiss-error") {
            state.apiError = null;
            render();
          } else if (action === "status-filter") {
            state.statusFilter = btn.dataset.value;
            render();
          } else if (action === "urgency-filter") {
            state.urgencyFilter = btn.dataset.value;
            render();
          } else if (action === "clear-filters") {
            state.search = "";

              matchType,
              matchValue,
              condicao: matchValue,
              rotulo: rotulosFinal.join(", "),
              categoria: categoriasFinal.join(", "),
            };
            ensureLabelsTracked(rotulosFinal);
            ensureCategoriesTracked(categoriasFinal);
            state.ruleFormMatchValue = "";
            state.ruleFormRotulos = [];
            state.ruleFormCategorias = [state.categories[0] || "Outro"];
            state.ruleFormRotuloDraft = "";
            state.ruleFormCategoriaDraft = "";
            state.rules = [newRule, ...state.rules];
            void persistRules(state.rules);
          } else if (form.id === "create-label-form") {
            const val = document.getElementById("new-label-input").value.trim();
            if (!val) return;
            ensureLabelsTracked([val]);
            state.newLabelInput = "";
            render();
          } else if (form.id === "create-category-form") {
            const val = document.getElementById("new-category-input").value.trim();
            if (!val) return;
            ensureCategoriesTracked([val]);
            state.newCategoryInput = "";
            render();
          }
        });

        document.addEventListener("mousedown", (e) => {
          if (!state.openCardPicker && !state.openModalPickerType) return;
          if (!e.target.closest("[data-picker-root]")) {
            state.openCardPicker = null;
            state.openModalPickerType = null;
            state.pickerNewDraft = "";
            render();
          }
        });

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (state.confirmDeleteTask) {
              e.preventDefault();
              state.confirmDeleteTask = null;
              render();
              return;
            }
            if (state.openCardPicker || state.openModalPickerType) {
              e.preventDefault();
              state.openCardPicker = null;
              state.openModalPickerType = null;
              state.pickerNewDraft = "";
              render();
              return;
            }
            if (state.modalTask) {
              state.modalTask = null;
              state.modalForm = null;
              render();
            }
          }
        });

        async function init() {
          render();
          try {
            const payload = await fetchInitialFromGas();
            applyGasPayload(payload);
            state.syncFeedback = `Dados carregados às ${formatCurrentTime()}`;
          } catch (err) {
            state.apiError =
              err instanceof Error
                ? err.message
                : "Não foi possível carregar os dados da Planilha Google.";
          } finally {
            state.isInitialLoading = false;
            render();
          }
        }

        init();
      })();
    </script>
  </body>
</html>
