<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triagem Executiva — Gestão de Demandas Corporativas</title>
    <meta
      name="description"
      content="Painel executivo de triagem de e-mails corporativos integrado ao Gmail e Planilha Google via Google Apps Script."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"DM Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
              display: ['"Plus Jakarta Sans"', '"DM Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ['"JetBrains Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("app_theme");
          const prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = saved === "dark" || (saved !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
        } catch {
          // Ignore storage access errors
        }
      })();
    </script>
    <script src="https://unpkg.com/lucide@0.546.0/dist/umd/lucide.min.js"></script>
    <style>
      html.dark {
        color-scheme: dark;
        color: #f1f5f9;
        background-color: #020617;
      }
      body {
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .font-display {
        font-family: "Plus Jakarta Sans", "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }
      .font-mono {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      }
      @keyframes cardDetailsFadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-card-details {
        animation: cardDetailsFadeIn 0.18s ease-out;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors">
    <div id="app" class="min-h-screen flex bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors"></div>

    <script>
      (() => {
        const API_URL =
          "https://script.google.com/macros/s/AKfycbw1DQJVPXCKh6n-wi_xtwK0IvUOBVEcYMMf2ppgx81MESumH3Yj-K9G7ICRLwsN3AtuFA/exec";

        const DEFAULT_CATEGORIES = [
          "Redação",
          "Revisão",
          "Eventos e Roteiros",
          "Reunião",
          "Administrativo",
          "Jurídico",
          "Financeiro",
          "Operações",
          "Outro",
        ];

        const DEFAULT_RULES = [
          {
            id: "rule-juridico",
            ativo: true,
            matchType: "dominio",
            matchValue: "@machadoassociados.com.br",
            rotulo: "Jurídico Externo",
            categoria: "Revisão",
          },
          {
            id: "rule-diretoria",
            ativo: true,
            matchType: "nome",
            matchValue: "Diretoria Executiva",
            rotulo: "Diretoria",
            categoria: "Reunião",
          },
          {
            id: "rule-financeiro",
            ativo: true,
            matchType: "conteudo",
            matchValue: "nota fiscal",
            rotulo: "Financeiro",
            categoria: "Administrativo",
          },
        ];

        const TASK_STATUS_OPTIONS = [
          "A Fazer",
          "Iniciado",
          "Aguardando",
          "Concluído",
        ];

        const STATUS_FILTER_OPTIONS = ["Todos", ...TASK_STATUS_OPTIONS];

        const MATCH_TYPE_LABELS = {
          email: "E-mail do solicitante",
          dominio: "Domínio (@empresa)",
          nome: "Nome do solicitante",
          conteudo: "Assunto ou conteúdo",
        };

        const PT_BR_MONTHS_SHORT = [
          "jan",
          "fev",
          "mar",
          "abr",
          "mai",
          "jun",
          "jul",
          "ago",
          "set",
          "out",
          "nov",
          "dez",
        ];

        const STORAGE_CATEGORIES_KEY = "triagem_executiva_categories_v1";
        const STORAGE_DELETED_CATEGORIES_KEY = "categorias_excluidas";
        const STORAGE_LABELS_KEY = "triagem_executiva_labels_v1";
        const STORAGE_LABEL_COLORS_KEY = "triagem_executiva_label_colors_v1";
        const STORAGE_VIEWED_IDS_KEY = "triagem_executiva_viewed_ids_v1";
        const STORAGE_DELETED_IDS_KEY = "ids_excluidos";
        const STORAGE_THEME_KEY = "app_theme";

        function getInitialTheme() {
          try {
            const saved = localStorage.getItem(STORAGE_THEME_KEY);
            if (saved === "dark" || saved === "light") return saved;
          } catch {
            // Ignore storage access errors
          }
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            return "dark";
          }
          return "light";
        }

        function applyTheme(theme) {
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          try {
            localStorage.setItem(STORAGE_THEME_KEY, theme);
          } catch {
            // Ignore storage quota errors
          }
        }

        const LABEL_COLOR_PALETTE = [
          { name: "Azul", hex: "#2563eb" },
          { name: "Verde", hex: "#16a34a" },
          { name: "Âmbar", hex: "#d97706" },
          { name: "Roxo", hex: "#7c3aed" },
          { name: "Rosa", hex: "#db2777" },
          { name: "Índigo", hex: "#4f46e5" },
          { name: "Ciano", hex: "#0891b2" },
          { name: "Coral", hex: "#dc2626" },
          { name: "Esmeralda", hex: "#0d9488" },
          { name: "Cinza", hex: "#475569" },
        ];

        const SORT_OPTIONS = [
          { value: "prazo_asc", label: "Prazo mais próximo" },
          { value: "recebido_desc", label: "Recebidos mais recentes" },
          { value: "recebido_asc", label: "Recebidos mais antigos" },
          { value: "urgencia_desc", label: "Maior urgência" },
        ];

        function parseMultiValueField(rawValue, fallback) {
          let parts = [];
          if (Array.isArray(rawValue)) {
            parts = rawValue.map((item) => String(item ?? "").trim());
          } else if (rawValue !== null && rawValue !== undefined) {
            parts = String(rawValue)
              .split(",")
              .map((item) => item.trim());
          }
          const seen = new Set();
          const result = [];
          for (const part of parts) {
            if (!part) continue;
            const key = part.toLowerCase();
            if (!seen.has(key)) {
              seen.add(key);
              result.push(part);
            }
          }
          if (result.length === 0 && fallback) {
            return [fallback];
          }
          return result;
        }

        function normalizeTagList(items, fallback) {
          const seen = new Set();
          const result = [];
          for (const item of items || []) {
            const cleaned = String(item ?? "").trim();
            if (!cleaned) continue;
            const key = cleaned.toLowerCase();
            if (!seen.has(key)) {
              seen.add(key);
              result.push(cleaned);
            }
          }
          if (result.length === 0 && fallback) {
            return [fallback];
          }
          return result;
        }

        function getExcludedCategorySet(overrideList) {
          const list = overrideList ?? loadStoredIdList(STORAGE_DELETED_CATEGORIES_KEY);
          return new Set(list.map((c) => String(c ?? "").trim().toLowerCase()).filter(Boolean));
        }

        function loadStoredCategories() {
          const excludedSet = getExcludedCategorySet();
          try {
            const raw = localStorage.getItem(STORAGE_CATEGORIES_KEY);
            if (raw === null) {
              return DEFAULT_CATEGORIES.filter((c) => !excludedSet.has(c.toLowerCase()));
            }
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              const seen = new Set();
              const result = [];
              for (const c of parsed) {
                for (const part of parseMultiValueField(c, "")) {
                  const key = part.toLowerCase();
                  if (!excludedSet.has(key) && !seen.has(key)) {
                    seen.add(key);
                    result.push(part);
                  }
                }
              }
              return result;
            }
            return DEFAULT_CATEGORIES.filter((c) => !excludedSet.has(c.toLowerCase()));
          } catch {
            return DEFAULT_CATEGORIES.filter((c) => !excludedSet.has(c.toLowerCase()));
          }
        }

        function saveStoredCategories(cats) {
          try {
            localStorage.setItem(STORAGE_CATEGORIES_KEY, JSON.stringify(cats));
          } catch {
            // Ignore storage errors
          }
        }

        function loadStoredLabels() {
          try {
            const raw = localStorage.getItem(STORAGE_LABELS_KEY);
            if (!raw) return ["Geral"];
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const set = new Set(["Geral"]);
              for (const lbl of parsed) {
                const cleaned = String(lbl ?? "").trim();
                if (cleaned) set.add(cleaned);
              }
              const others = Array.from(set)
                .filter((lbl) => lbl !== "Geral")
                .sort((a, b) => a.localeCompare(b, "pt-BR"));
              return ["Geral", ...others];
            }
            return ["Geral"];
          } catch {
            return ["Geral"];
          }
        }

        function saveStoredLabels(lbls) {
          try {
            localStorage.setItem(STORAGE_LABELS_KEY, JSON.stringify(lbls));
          } catch {
            // Ignore storage errors
          }
        }

        function loadStoredLabelColors() {
          try {
            const raw = localStorage.getItem(STORAGE_LABEL_COLORS_KEY);
            if (!raw) return {};
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
              return {};
            }
            const cleaned = {};
            for (const [key, val] of Object.entries(parsed)) {
              const name = String(key ?? "").trim();
              const hex = String(val ?? "").trim();
              if (name && /^#[0-9a-f]{6}$/i.test(hex)) {
                cleaned[name] = hex.toLowerCase();
              }
            }
            return cleaned;
          } catch {
            return {};
          }
        }

        function saveStoredLabelColors(colors) {
          try {
            localStorage.setItem(STORAGE_LABEL_COLORS_KEY, JSON.stringify(colors));
          } catch {
            // Ignore storage errors
          }
        }

        function loadStoredIdList(storageKey) {
          try {
            const raw = localStorage.getItem(storageKey);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            const set = new Set();
            for (const item of parsed) {
              const cleaned = String(item ?? "").trim();
              if (cleaned) set.add(cleaned);
            }
            return Array.from(set);
          } catch {
            return [];
          }
        }

        function saveStoredIdList(storageKey, ids) {
          try {
            localStorage.setItem(storageKey, JSON.stringify(ids));
          } catch {
            // Ignore storage errors
          }
        }

        function parseHexRgb(hex) {
          const clean = String(hex ?? "").trim().replace(/^#/, "");
          if (!/^[0-9a-f]{6}$/i.test(clean)) return null;
          return {
            r: parseInt(clean.slice(0, 2), 16),
            g: parseInt(clean.slice(2, 4), 16),
            b: parseInt(clean.slice(4, 6), 16),
          };
        }

        function findLabelColorHex(label, labelColors) {
          const trimmed = String(label ?? "").trim();
          if (!trimmed || !labelColors) return undefined;
          if (labelColors[trimmed]) return labelColors[trimmed];
          const lower = trimmed.toLowerCase();
          for (const [k, v] of Object.entries(labelColors)) {
            if (k.toLowerCase() === lower) return v;
          }
          return undefined;
        }

        function getLabelBadgeStyleAttr(label, labelColors) {
          const isDark = state && state.theme === "dark";
          const hex = findLabelColorHex(label, labelColors);
          const rgb = hex ? parseHexRgb(hex) : null;
          if (!rgb) {
            if (isDark) {
              return "background-color: rgba(148, 163, 184, 0.16); border-color: rgba(148, 163, 184, 0.34); color: #e2e8f0;";
            }
            return "background-color: rgba(100, 116, 139, 0.09); border-color: rgba(100, 116, 139, 0.24); color: #334155;";
          }
          const { r, g, b } = rgb;
          const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          if (isDark) {
            const mix = luminance < 0.45 ? 0.62 : 0.46;
            const textR = Math.round(r + (255 - r) * mix);
            const textG = Math.round(g + (255 - g) * mix);
            const textB = Math.round(b + (255 - b) * mix);
            return `background-color: rgba(${r}, ${g}, ${b}, 0.24); border-color: rgba(${r}, ${g}, ${b}, 0.48); color: rgb(${textR}, ${textG}, ${textB});`;
          }
          const factor = luminance > 0.52 ? 0.44 : luminance > 0.38 ? 0.68 : 0.82;
          const textR = Math.round(r * factor);
          const textG = Math.round(g * factor);
          const textB = Math.round(b * factor);
          return `background-color: rgba(${r}, ${g}, ${b}, 0.12); border-color: rgba(${r}, ${g}, ${b}, 0.30); color: rgb(${textR}, ${textG}, ${textB});`;
        }

        function getTaskLabels(task) {
          if (!task) return ["Geral"];
          return Array.isArray(task.rotulos) && task.rotulos.length > 0
            ? normalizeTagList(task.rotulos, "Geral")
            : parseMultiValueField(task.rotulo_aplicado, "Geral");
        }

        function getTaskCategories(task) {
          if (!task) return ["Outro"];
          return Array.isArray(task.categorias) && task.categorias.length > 0
            ? normalizeTagList(task.categorias, "Outro")
            : parseMultiValueField(task.categoria, "Outro");
        }

        function uuid() {
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return window.crypto.randomUUID();
          }
          return "id-" + Math.random().toString(36).slice(2) + "-" + Date.now().toString(36);
        }

        function escapeHtml(value) {
          return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function normalizeEmailSubject(subject) {
          if (!subject) return "";
          let cleaned = String(subject).trim();
          const prefixPattern =
            /^(?:\[\s*)?(?:res|re|enc|fwd|fw|rv|tr)\s*(?:\[\d+\])?\s*[:\-]\s*/i;
          while (prefixPattern.test(cleaned)) {
            cleaned = cleaned.replace(prefixPattern, "").trim();
          }
          return cleaned.replace(/\s+/g, " ").trim();
        }

        function formatDisplayDate(isoDate, emptyFallback = "Sem prazo") {
          if (!isoDate) return emptyFallback;
          const trimmed = String(isoDate).trim();
          if (!trimmed) return emptyFallback;

          const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(trimmed);
          if (!match) return trimmed;

          const year = Number(match[1]);
          const monthIndex = Number(match[2]) - 1;
          const day = Number(match[3]);
          if (
            Number.isNaN(year) ||
            Number.isNaN(monthIndex) ||
            Number.isNaN(day) ||
            monthIndex < 0 ||
            monthIndex > 11 ||
            day < 1 ||
            day > 31
          ) {
            return trimmed;
          }

          const dd = String(day).padStart(2, "0");
          const currentYear = new Date().getFullYear();
          if (year === currentYear) {
            return `${dd}/${PT_BR_MONTHS_SHORT[monthIndex]}`;
          }
          const mm = String(monthIndex + 1).padStart(2, "0");
          return `${dd}/${mm}/${year}`;
        }

        function toLocalIsoDay(date) {
          const yyyy = date.getFullYear();
          const mm = String(date.getMonth() + 1).padStart(2, "0");
          const dd = String(date.getDate()).padStart(2, "0");
          return `${yyyy}-${mm}-${dd}`;
        }

        function renderDeadlineBadge(isoDate, isCompleted) {
          const trimmed = String(isoDate ?? "").trim();
          const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(trimmed);

          let text = "Sem prazo";
          let containerClass =
            "bg-slate-100 text-slate-500 border-slate-200 dark:bg-slate-800/80 dark:text-slate-400 dark:border-slate-700";
          let iconClass = "text-slate-400 dark:text-slate-500";

          if (match) {
            const formatted = formatDisplayDate(trimmed, "Sem prazo");
            if (isCompleted) {
              text = formatted;
            } else {
              const deadlineIso = `${match[1]}-${match[2]}-${match[3]}`;
              const now = new Date();
              const todayIso = toLocalIsoDay(now);
              const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
              const tomorrowIso = toLocalIsoDay(tomorrow);

              if (deadlineIso < todayIso) {
                text = `${formatted} (Atrasado)`;
                containerClass =
                  "bg-red-50 text-red-700 border-red-200 font-medium dark:bg-red-950/60 dark:text-red-300 dark:border-red-800/70";
                iconClass = "text-red-600 dark:text-red-400";
              } else if (deadlineIso === todayIso) {
                text = `${formatted} (Hoje)`;
                containerClass =
                  "bg-amber-50 text-amber-800 border-amber-200 font-medium dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800/70";
                iconClass = "text-amber-600 dark:text-amber-400";
              } else if (deadlineIso === tomorrowIso) {
                text = `${formatted} (Amanhã)`;
                containerClass =
                  "bg-amber-50 text-amber-800 border-amber-200 font-medium dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800/70";
                iconClass = "text-amber-600 dark:text-amber-400";
              } else {
                text = formatted;
                containerClass =
                  "bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800/70";
                iconClass = "text-emerald-600 dark:text-emerald-400";
              }
            }
          }

          return `<span title="${escapeHtml(trimmed)}"
            class="inline-flex items-center gap-1 px-2 py-0.5 border rounded-md font-mono tabular-nums text-xs whitespace-nowrap shrink-0 ${containerClass}">
            <i data-lucide="calendar" class="w-3.5 h-3.5 shrink-0 ${iconClass}"></i>
            <span>${escapeHtml(text)}</span>
          </span>`;
        }

        function formatReceivedDateTime(isoDateTime, fallbackDate, emptyFallback = "Sem data") {
          const source = String(isoDateTime || fallbackDate || "").trim();
          if (!source) return emptyFallback;

          const match = /^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/.exec(source);
          if (!match) return source;

          const year = Number(match[1]);
          const monthIndex = Number(match[2]) - 1;
          const day = Number(match[3]);
          const hour = match[4];
          const minute = match[5];

          if (
            Number.isNaN(year) ||
            Number.isNaN(monthIndex) ||
            Number.isNaN(day) ||
            monthIndex < 0 ||
            monthIndex > 11 ||
            day < 1 ||
            day > 31
          ) {
            return source;
          }

          const dd = String(day).padStart(2, "0");
          const mmm = PT_BR_MONTHS_SHORT[monthIndex];
          const currentYear = new Date().getFullYear();
          const datePart = year === currentYear ? `${dd}/${mmm}` : `${dd}/${mmm}/${year}`;

          if (hour !== undefined && minute !== undefined) {
            return `${datePart} às ${hour}:${minute}`;
          }
          return datePart;
        }

        function getNowIsoDateTime() {
          const now = new Date();
          const yyyy = now.getFullYear();
          const mm = String(now.getMonth() + 1).padStart(2, "0");
          const dd = String(now.getDate()).padStart(2, "0");
          const hh = String(now.getHours()).padStart(2, "0");
          const min = String(now.getMinutes()).padStart(2, "0");
          return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        }

        function formatCurrentTime() {
          const now = new Date();
          return `${String(now.getHours()).padStart(2, "0")}:${String(
            now.getMinutes()
          ).padStart(2, "0")}`;
        }

        function normalizeUrgency(value) {
          const s = String(value ?? "").trim().toLowerCase();
          if (s === "alta") return "Alta";
          if (s === "média" || s === "media") return "Média";
          return "Baixa";
        }

        function normalizeStatus(value, completed) {
          const s = String(value ?? "").trim().toLowerCase();
          if (s === "iniciado") return "Iniciado";
          if (s === "aguardando") return "Aguardando";
          if (s === "concluído" || s === "concluido") return "Concluído";
          if (s === "a fazer") return "A Fazer";
          return completed === true ? "Concluído" : "A Fazer";
        }

        function normalizeIsoDate(value) {
          if (value === null || value === undefined) return null;
          const text = String(value).trim();
          if (!text || text.toLowerCase() === "null" || text === "—") return null;

          const isoMatch = /^(\d{4}-\d{2}-\d{2})/.exec(text);
          if (isoMatch) return isoMatch[1];

          const brMatch = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(text);
          if (brMatch) return `${brMatch[3]}-${brMatch[2]}-${brMatch[1]}`;
          return null;
        }

        function normalizeIsoDateTime(value, fallbackDate) {
          if (value === null || value === undefined) return fallbackDate;
          const text = String(value).trim();
          if (!text || text.toLowerCase() === "null") return fallbackDate;
          const isoMatch = /^(\d{4}-\d{2}-\d{2})(?:[T\s](\d{2}:\d{2}))?/.exec(text);
          if (isoMatch) {
            return isoMatch[2] ? `${isoMatch[1]} ${isoMatch[2]}` : isoMatch[1];
          }
          return fallbackDate;
        }

        function parseThreadHistory(
          rawHistory,
          fallbackSenderName,
          fallbackSenderEmail,
          fallbackDateTime,
          fallbackSummary,
          taskId
        ) {
          let parsedList = [];
          if (Array.isArray(rawHistory)) {
            parsedList = rawHistory;
          } else if (typeof rawHistory === "string" && rawHistory.trim().startsWith("[")) {
            try {
              const parsed = JSON.parse(rawHistory);
              if (Array.isArray(parsed)) parsedList = parsed;
            } catch {
              parsedList = [];
            }
          }

          const normalized = parsedList
            .map((item, idx) => {
              const obj = item || {};
              const dataHora = normalizeIsoDateTime(
                obj.data_hora ?? obj.dataHora ?? obj.data,
                fallbackDateTime
              );
              return {
                id: String(obj.id ?? `msg-${taskId}-${idx}`),
                remetente_nome:
                  String(obj.remetente_nome ?? obj.remetente ?? fallbackSenderName).trim() ||
                  fallbackSenderName,
                remetente_email: String(obj.remetente_email ?? obj.email ?? "").trim(),
                data_hora: dataHora,
                resumo: String(obj.resumo ?? obj.conteudo ?? obj.mensagem ?? "").trim(),
              };
            })
            .filter((m) => m.resumo.length > 0);

          if (normalized.length === 0 && fallbackSummary) {
            normalized.push({
              id: `msg-${taskId}-0`,
              remetente_nome: fallbackSenderName || "Remetente",
              remetente_email: fallbackSenderEmail,
              data_hora: fallbackDateTime,
              resumo: fallbackSummary,
            });
          }
          return normalized.sort((a, b) => a.data_hora.localeCompare(b.data_hora));
        }

        function normalizeTask(raw, index) {
          const r = raw || {};
          const id = String(r.id ?? `demanda-${index}-${uuid()}`);
          const status = normalizeStatus(r.status, r.completed);
          const solicitanteNome = String(r.solicitante_nome ?? r.solicitante ?? "Solicitante").trim();
          const solicitanteEmail = String(r.solicitante_email ?? r.email ?? "").trim();
          const dataOriginal = normalizeIsoDate(r.data_email_original ?? r.data_recebimento) || "";
          const dataHoraOriginal = normalizeIsoDateTime(
            r.data_hora_email_original ?? r.data_hora_recebimento ?? r.data_email_original,
            dataOriginal
          );
          const titulo = String(r.titulo ?? "Demanda sem título").trim();
          const descricao = String(r.descricao ?? "").trim();
          const rawAssunto =
            [r.assunto_normalizado, r.assunto_original, r.assunto, r.subject]
              .map((v) => (v === null || v === undefined ? "" : String(v).trim()))
              .find(
                (v) =>
                  v.length > 0 &&
                  v.toLowerCase() !== "null" &&
                  v.toLowerCase() !== "undefined"
              ) ?? "";
          const assuntoLimpo =
            normalizeEmailSubject(rawAssunto) || rawAssunto || "Sem assunto";

          const rotulos = parseMultiValueField(
            r.rotulos ?? r.rotulo_aplicado ?? r.rotulo,
            "Geral"
          );
          const categorias = parseMultiValueField(r.categorias ?? r.categoria, "Outro");

          const historico_mensagens = parseThreadHistory(
            r.historico_mensagens,
            solicitanteNome,
            solicitanteEmail,
            dataHoraOriginal,
            descricao || titulo,
            id
          );

          const rawObs = String(r.observacoes ?? "").trim();
          const rawMotivo = String(
            r.motivo_aguardo ?? r.observacao_status ?? r.statusNote ?? ""
          ).trim();
          const resolvedNote = rawMotivo || rawObs || undefined;
          const resolvedObservacoes = rawObs || rawMotivo || undefined;

          return {
            id,
            triageId: String(r.triageId ?? r.thread_id ?? "gmail"),
            titulo,
            descricao,
            prazo: normalizeIsoDate(r.prazo),
            prazo_texto_original: r.prazo_texto_original
              ? String(r.prazo_texto_original).trim()
              : null,
            urgencia: normalizeUrgency(r.urgencia),
            categoria: categorias.join(", "),
            categorias,
            assunto_original: assuntoLimpo,
            assunto_normalizado: assuntoLimpo,
            solicitante_nome: solicitanteNome,
            solicitante_email: solicitanteEmail,
            data_email_original: dataOriginal || dataHoraOriginal.slice(0, 10),
            data_hora_email_original: dataHoraOriginal,
            rotulo_aplicado: rotulos.join(", "),
            rotulos,
            regra_acionada: Boolean(r.regra_acionada ?? false),
            status,
            statusNote: resolvedNote,
            motivo_aguardo: resolvedNote,
            observacao_status: resolvedObservacoes,
            observacoes: resolvedObservacoes,
            hasNewMessage: Boolean(r.hasNewMessage ?? r.nova_mensagem ?? false),
            historico_mensagens,
            completed: status === "Concluído",
            completedAt: r.completedAt ? String(r.completedAt) : undefined,
          };
        }

        function normalizeMatchType(value) {
          const s = String(value ?? "").trim().toLowerCase();
          if (s === "email" || s === "e-mail") return "email";
          if (s === "dominio" || s === "domínio") return "dominio";
          if (s === "nome") return "nome";
          return "conteudo";
        }

        function inferMatchTypeFromCondicao(condicao) {
          const cleaned = String(condicao ?? "").trim();
          if (cleaned.startsWith("@")) return "dominio";
          if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleaned)) return "email";
          return "conteudo";
        }

        function normalizeRule(raw, index) {
          const r = raw || {};
          const condicao = String(r.condicao ?? r.matchValue ?? r.valor ?? "").trim();
          const rawMatchType = r.matchType ?? r.criterio;
          const hasExplicitMatchType =
            rawMatchType !== undefined && String(rawMatchType).trim().length > 0;
          const rotuloList = parseMultiValueField(r.rotulos ?? r.rotulo, "Geral");
          const categoriaList = parseMultiValueField(r.categorias ?? r.categoria, "Outro");
          return {
            id: String(r.id ?? `rule-${index}-${uuid()}`),
            ativo: r.ativo !== false && r.ativa !== false && r.ativo !== "false",
            matchType: hasExplicitMatchType
              ? normalizeMatchType(rawMatchType)
              : inferMatchTypeFromCondicao(condicao),
            matchValue: condicao,
            condicao,
            rotulo: rotuloList.join(", "),
            categoria: categoriaList.join(", "),
          };
        }

        function extractPayload(json) {
          const root = json || {};
          const container = root.data && typeof root.data === "object" ? root.data : root;
          if (container.erro || container.error) {
            throw new Error(String(container.erro ?? container.error));
          }

          const rawDemandas = Array.isArray(container.demandas) ? container.demandas : [];
          const rawRegras = Array.isArray(container.regras) ? container.regras : [];
          const rawCategorias = Array.isArray(container.categorias)
            ? container.categorias.map((c) => String(c ?? "").trim()).filter(Boolean)
            : [];

          return {
            demandas: rawDemandas.map((item, idx) => normalizeTask(item, idx)),
            regras: rawRegras
              .map((item, idx) => normalizeRule(item, idx))
              .filter((r) => (r.condicao || r.matchValue).length > 0 && r.rotulo.length > 0),
            categorias: rawCategorias,
          };
        }

        function buildDemandPayloadObject(demanda) {
          const rotulosFinal = normalizeTagList(
            Array.isArray(demanda.rotulos)
              ? demanda.rotulos
              : parseMultiValueField(demanda.rotulo_aplicado, "Geral"),
            "Geral"
          );
          const categoriasFinal = normalizeTagList(
            Array.isArray(demanda.categorias)
              ? demanda.categorias
              : parseMultiValueField(demanda.categoria, "Outro"),
            "Outro"
          );
          const rotuloJoined = rotulosFinal.join(", ");
          const categoriaJoined = categoriasFinal.join(", ");
          const rawAssunto = String(
            demanda.assunto_normalizado || demanda.assunto_original || ""
          ).trim();
          const assuntoLimpo =
            normalizeEmailSubject(rawAssunto) || rawAssunto || "Sem assunto";
          const syncedNote = String(
            demanda.observacoes ??
              demanda.motivo_aguardo ??
              demanda.observacao_status ??
              demanda.statusNote ??
              ""
          ).trim();

          return {
            ...demanda,
            assunto_original: assuntoLimpo,
            assunto_normalizado: assuntoLimpo,
            rotulos: rotulosFinal,
            categorias: categoriasFinal,
            rotulo_aplicado: rotuloJoined,
            rotulo: rotuloJoined,
            categoria: categoriaJoined,
            observacoes: syncedNote,
            motivo_aguardo: syncedNote,
            observacao_status: syncedNote,
            statusNote: syncedNote,
          };
        }

        async function postCreateDemandToGas(demanda) {
          const objetoDaNovaDemanda = buildDemandPayloadObject(demanda);

          const res = await fetch(API_URL, {
            method: "POST",
            redirect: "follow",
            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },
            body: JSON.stringify({
              acao: "criar_demanda",
              demanda: objetoDaNovaDemanda,
            }),
          });
          if (!res.ok) {
            throw new Error(`Erro HTTP ${res.status} ao criar demanda na planilha.`);
          }
          const text = await res.text();
          if (!text.trim().startsWith("{")) {
            return null;
          }
          const parsed = JSON.parse(text);
          const container =
            parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
          if (container.erro || container.error) {
            throw new Error(String(container.erro ?? container.error));
          }
          const hasDemandas = Array.isArray(container.demandas);
          const hasRegras = Array.isArray(container.regras);
          if (!hasDemandas && !hasRegras) {
            return null;
          }
          return {
            demandas: hasDemandas
              ? container.demandas.map((item, idx) => normalizeTask(item, idx))
              : null,
            regras: hasRegras
              ? container.regras
                  .map((item, idx) => normalizeRule(item, idx))
                  .filter((r) => (r.condicao || r.matchValue).length > 0 && r.rotulo.length > 0)
              : null,
            categorias: Array.isArray(container.categorias)
              ? container.categorias.map((c) => String(c ?? "").trim()).filter(Boolean)
              : [],
          };
        }

        function mergeCategoryLists(base, incoming, rules, tasks, excludedOverride) {
          const excludedSet = getExcludedCategorySet(excludedOverride);
          const seen = new Set();
          const result = [];
          const tryAdd = (rawItem) => {
            const cleaned = String(rawItem ?? "").trim();
            if (!cleaned) return;
            const key = cleaned.toLowerCase();
            if (excludedSet.has(key) || seen.has(key)) return;
            seen.add(key);
            result.push(cleaned);
          };

          for (const c of base || []) {
            for (const part of parseMultiValueField(c, "")) tryAdd(part);
          }
          for (const c of incoming || []) {
            for (const part of parseMultiValueField(c, "")) tryAdd(part);
          }
          for (const r of rules || []) {
            for (const part of parseMultiValueField(r.categoria, "")) tryAdd(part);
          }
          for (const t of tasks || []) {
            for (const part of getTaskCategories(t)) tryAdd(part);
          }
          return result.sort((a, b) => a.localeCompare(b, "pt-BR"));
        }

        function mergeLabelLists(base, rules, tasks) {
          const set = new Set(["Geral"]);
          for (const lbl of base) {
            for (const part of parseMultiValueField(lbl, "")) set.add(part);
          }
          for (const r of rules) {
            for (const part of parseMultiValueField(r.rotulo, "")) set.add(part);
          }
          for (const t of tasks) {
            for (const part of getTaskLabels(t)) set.add(part);
          }
          const others = Array.from(set)
            .filter((lbl) => lbl !== "Geral")
            .sort((a, b) => a.localeCompare(b, "pt-BR"));
          return ["Geral", ...others];
        }

        function ensureLabelsTracked(rawLabels) {
          const cleaned = normalizeTagList(rawLabels);
          if (cleaned.length === 0) return;
          const missing = cleaned.filter(
            (item) => !state.labels.some((lbl) => lbl.toLowerCase() === item.toLowerCase())
          );
          if (missing.length > 0) {
            state.labels = mergeLabelLists([...state.labels, ...missing], [], []);
            saveStoredLabels(state.labels);
          }
        }

        function ensureCategoriesTracked(rawCategories) {
          const cleaned = normalizeTagList(rawCategories);
          if (cleaned.length === 0) return;
          const cleanedLower = new Set(cleaned.map((c) => c.toLowerCase()));
          const nextDeleted = state.deletedCategories.filter(
            (c) => !cleanedLower.has(c.toLowerCase())
          );
          if (nextDeleted.length !== state.deletedCategories.length) {
            state.deletedCategories = nextDeleted;
            saveStoredIdList(STORAGE_DELETED_CATEGORIES_KEY, nextDeleted);
          }
          const missing = cleaned.filter(
            (item) => !state.categories.some((c) => c.toLowerCase() === item.toLowerCase())
          );
          if (missing.length > 0) {
            state.categories = [...state.categories, ...missing].sort((a, b) =>
              a.localeCompare(b, "pt-BR")
            );
            saveStoredCategories(state.categories);
          }
        }

        function markTaskAsViewed(taskId) {
          if (!taskId) return;
          if (!state.viewedIds.includes(taskId)) {
            state.viewedIds = [...state.viewedIds, taskId];
            saveStoredIdList(STORAGE_VIEWED_IDS_KEY, state.viewedIds);
          }
        }

        function applyGasPayload(payload) {
          const excluded = new Set(loadStoredIdList(STORAGE_DELETED_IDS_KEY));
          const visibleDemandas = payload.demandas.filter((d) => !excluded.has(d.id));
          state.tasks = visibleDemandas;
          state.rules = payload.regras;
          state.categories = mergeCategoryLists(
            state.categories,
            payload.categorias,
            payload.regras,
            visibleDemandas,
            state.deletedCategories
          );
          saveStoredCategories(state.categories);
          state.labels = mergeLabelLists(
            state.labels.length > 0 ? state.labels : ["Geral"],
            payload.regras,
            visibleDemandas
          );
          saveStoredLabels(state.labels);
          if (state.ruleFormCategorias.length === 0) {
            state.ruleFormCategorias = [state.categories[0] || "Outro"];
          }
        }

        function getAvailableLabels() {
          return mergeLabelLists(state.labels, state.rules, state.tasks);
        }

        function getAvailableCategories() {
          return mergeCategoryLists(
            state.categories,
            [],
            state.rules,
            state.tasks,
            state.deletedCategories
          );
        }

        function getActiveLabelFilter(availableLabels) {
          return state.labelFilter === "Todos" || availableLabels.includes(state.labelFilter)
            ? state.labelFilter
            : "Todos";
        }

        function getActiveCategoryFilter(availableCategories) {
          return state.categoryFilter === "Todas" || availableCategories.includes(state.categoryFilter)
            ? state.categoryFilter
            : "Todas";
        }

        function getUrgencyWeight(u) {
          if (u === "Alta") return 3;
          if (u === "Média") return 2;
          return 1;
        }

        function getFilteredTasks() {
          const q = state.search.trim().toLowerCase();
          const availableLabels = getAvailableLabels();
          const availableCategories = getAvailableCategories();
          const activeLabelFilter = getActiveLabelFilter(availableLabels);
          const activeCategoryFilter = getActiveCategoryFilter(availableCategories);

          const list = state.tasks.filter((task) => {
            const currentStatus = task.status ?? (task.completed ? "Concluído" : "A Fazer");
            const taskLabels = getTaskLabels(task);
            const taskCategories = getTaskCategories(task);
            if (state.statusFilter === "Concluído") {
              if (currentStatus !== "Concluído") return false;
            } else {
              if (currentStatus === "Concluído") return false;
              if (state.statusFilter !== "Todos" && currentStatus !== state.statusFilter) {
                return false;
              }
            }
            if (state.urgencyFilter !== "Todas" && task.urgencia !== state.urgencyFilter) return false;
            if (activeLabelFilter !== "Todos" && !taskLabels.includes(activeLabelFilter)) return false;
            if (activeCategoryFilter !== "Todas" && !taskCategories.includes(activeCategoryFilter)) {
              return false;
            }
            if (q) {
              const historyText = (task.historico_mensagens || [])
                .map((m) => `${m.remetente_nome} ${m.resumo}`)
                .join(" ");
              const haystack = [
                task.titulo,
                task.descricao,
                task.assunto_original,
                task.solicitante_nome,
                task.solicitante_email,
                taskCategories.join(" "),
                taskLabels.join(" "),
                task.statusNote || "",
                task.observacoes || "",
                historyText,
              ]
                .join(" ")
                .toLowerCase();
              if (!haystack.includes(q)) return false;
            }
            return true;
          });

          const prazoKey = (t) => (t.prazo && t.prazo.trim() ? t.prazo.trim() : "9999-12-31");
          const receivedKey = (t) => t.data_hora_email_original || t.data_email_original || "";

          return [...list].sort((a, b) => {
            if (state.sortBy === "prazo_asc") {
              const cmp = prazoKey(a).localeCompare(prazoKey(b));
              if (cmp !== 0) return cmp;
              return receivedKey(b).localeCompare(receivedKey(a));
            }
            if (state.sortBy === "recebido_desc") {
              return receivedKey(b).localeCompare(receivedKey(a));
            }
            if (state.sortBy === "recebido_asc") {
              return receivedKey(a).localeCompare(receivedKey(b));
            }
            const urgDiff = getUrgencyWeight(b.urgencia) - getUrgencyWeight(a.urgencia);
            if (urgDiff !== 0) return urgDiff;
            return prazoKey(a).localeCompare(prazoKey(b));
          });
        }

                    <i data-lucide="chevron-down" class="w-3 h-3 shrink-0 transition-transform ${
                      isOpen ? "rotate-180 text-blue-600 dark:text-blue-400" : "text-slate-400 dark:text-slate-500"
                    }"></i>
                  </button>`
              : `<button type="button" data-action="toggle-modal-picker" data-type="${escapeHtml(
                  mode
                )}" aria-expanded="${isOpen ? "true" : "false"}"
                  class="w-full min-h-[38px] px-2.5 py-1.5 bg-white dark:bg-slate-800 border rounded-lg flex items-center justify-between gap-2 text-left transition-colors cursor-pointer ${
                    isOpen
                      ? "border-blue-600 ring-2 ring-blue-600/20 dark:border-blue-500"
                      : "border-slate-200 hover:border-slate-300 dark:border-slate-700 dark:hover:border-slate-600"
                  }">
                  <div class="flex flex-wrap items-center gap-1.5 flex-1 min-w-0">
                    ${currentSelected
                      .map((item) => {
                        if (isLabel) {
                          const hex = findLabelColorHex(item, state.labelColors);
                          const dotHtml = hex
                            ? `<span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${escapeHtml(
                                hex
                              )};"></span>`
                            : "";
                          return `<span style="${getLabelBadgeStyleAttr(item, state.labelColors)}"
                            class="inline-flex items-center gap-1.5 px-2 py-0.5 text-xs font-medium border rounded-md whitespace-nowrap">

                        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 dark:bg-slate-700/80 dark:text-slate-200 dark:border-slate-600 rounded-md whitespace-nowrap">
                          <span>${escapeHtml(item)}</span>

          const placeholder = isLabel ? "Novo rótulo..." : "Nova categoria...";
          const ariaAdd = isLabel ? "Novo rótulo" : "Nova categoria";

          const popoverHtml = isOpen
            ? `<div role="dialog" aria-label="${

                  <input type="text" data-role="picker-new-input"

                    placeholder="${placeholder}" aria-label="${ariaAdd}"
                    class="flex-1 min-w-0 px-2.5 py-1.5 text-xs text-slate-900 bg-white border border-slate-200 dark:text-slate-100 dark:bg-slate-950 dark:border-slate-700 dark:placeholder:text-slate-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 dark:focus:border-blue-500" />
                  <button type="button" data-action="picker-add-option"
                    aria-label="Adicionar ${isLabel ? "rótulo" : "categoria"}"
                    title="Adicionar e marcar"
                    class="inline-flex items-center justify-center p-1.5 text-white bg-blue-700 dark:bg-blue-600 rounded-lg hover:bg-blue-800 dark:hover:bg-blue-500 transition-colors shrink-0 cursor-pointer">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
                <div data-role="picker-list" class="max-h-56 overflow-y-auto p-1.5 divide-y divide-slate-50 dark:divide-slate-800/70">
                  ${sortedOptions
                    .map((opt) => {
                      const checked = isSelected(opt);
                      const hex = isLabel ? findLabelColorHex(opt, state.labelColors) : undefined;
                      const optionDisplay = isLabel
                        ? `<span class="inline-flex items-center gap-2 min-w-0 flex-1">
                            <span class="w-2.5 h-2.5 rounded-full shrink-0 border border-black/10 dark:border-white/20"

                            <span style="${getLabelBadgeStyleAttr(opt, state.labelColors)}"

                            checked ? "text-slate-900 dark:text-slate-100" : "text-slate-700 dark:text-slate-300"
                          }">${escapeHtml(opt)}</span>`;
                      return `<label class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg cursor-pointer transition-colors ${

                          opt

                        ${optionDisplay}

                          checked
                            ? '<i data-lucide="check" class="w-3.5 h-3.5 text-blue-700 dark:text-blue-400 shrink-0"></i>'
